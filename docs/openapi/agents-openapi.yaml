                    name: New MCP Server
                    description: ''
                    url: Financial Sub Agent
                    transport: streamable_http
                    serverType: CUSTOM
                    companyId: 1
                  - serverType: WORKBOOK
                    name: dg_Order.csv
                    description: ''
                    url: ''
                    transport: streamable_http
                    data:
                      id: ca45078d-ed26-4752-a7a7-4aed24af033c
                      workspaceId: 055b4db3-96e1-45e1-8ff5-3a911b779a53
                  - serverType: WORKBOOK
                    name: Install Metrics
                    description: ''
                    url: ''
