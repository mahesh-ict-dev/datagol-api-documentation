  /customAgents/api/v1/{agentId}:
    get:
      summary: Get Custom Agent by ID
      description: Returns the full configuration of a specific Custom Agent.
      operationId: getCustomAgentById
      tags:
        - Custom Agents
      parameters:
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the Custom Agent.
          example: f1c6ff59-f4b7-476e-b306-f8531b42863d
      responses:
        '200':
          description: Full agent configuration.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AgentResponse'
        '404':
          description: Agent not found in this tenant.
  /noCo/api/v2/elementPermissions/{elementType}/{agentId}:
    get:
      summary: Get Custom Agent Permissions
      description: Returns all users who have access to the specified agent and their permission levels.
      operationId: getAgentPermissions
      tags:
        - Permissions
      parameters:
        - name: elementType
          in: path
          required: true
          schema:
            type: string
            enum:
              - CUSTOM_AGENT
          description: Always CUSTOM_AGENT.
          example: CUSTOM_AGENT
        - name: agentId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the Custom Agent.
          example: 7bf5f4d6-743d-414f-aa4a-96f7a20ce0fd
      responses:
        '200':
          description: Array of permission grants for this agent.
        '403':
          description: User lacks VIEW_COPILOT permission.
  /noCo/api/v2/elementPermissions/bulk:
    post:
      summary: Share Agent with Team Members
      description: Grants one or more users access to a Custom Agent in a single atomic operation. Supports VIEWER, EDITOR, and CREATOR permission levels.
      operationId: bulkShareAgent
      tags:
        - Permissions
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BulkPermissionRequest'
            example:
              permissions:
                - elementId: 7bf5f4d6-743d-414f-aa4a-96f7a20ce0fd
                  elementType: CUSTOM_AGENT
                  userId: 935
                  permission: CREATOR
      responses:
        '200':
          description: Permissions applied successfully.
        '403':
          description: User lacks ASSIGN_ROLES permission.
  /noCo/api/v2/workspaces:
    get:
      summary: List All Workspaces
      description: Returns all workspaces in the company tenant. Use workspace id values as workspaceId in WORKBOOK_RAG and WORKSPACE_DOCUMENTS connector objects.
      operationId: listWorkspaces
      tags:
        - Reference Data
      responses:
        '200':
          description: Array of workspace objects.
  /noCo/api/v2/workspaces/{workspaceId}:
    get:
      summary: Get Workspace by ID
      description: Fetches workspace details scoped to a Custom Agent. Called when a user opens the agent from the side panel to load context-specific workspace data.
      operationId: getWorkspaceById
      tags:
        - Reference Data
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          example: 055b4db3-96e1-45e1-8ff5-3a911b779a53
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
            enum:
              - CUSTOM_AGENT
          description: Always CUSTOM_AGENT.
          example: CUSTOM_AGENT
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the Custom Agent.
          example: ac861ca7-d3c6-47ac-be63-abc49344b254
      responses:
        '200':
          description: Workspace details scoped to the agent.
  /connector/api/v1/instance:
    get:
      summary: List All AI Connectors
      description: Returns all AI connector instances available to the tenant. Use the id values (as strings) in configs.connectors for CONNECTOR type entries.
      operationId: listConnectors
      tags:
        - Reference Data
      responses:
        '200':
          description: Array of connector instance objects.
  /idp/api/v1/team:
    get:
      summary: List Team Members
      description: Returns all users in the company. Use userId values when sharing an agent via the bulk permissions endpoint.
      operationId: listTeamMembers
      tags:
        - Reference Data
      responses:
        '200':
          description: Array of user objects.
  /ai/api/v2/conversations:
    get:
      summary: List All Conversations
      description: Returns the list of all conversations for the authenticated user.
      operationId: listConversations
      tags:
        - Conversations
      responses:
        '200':
          description: Array of conversation objects.
    post:
      summary: Initiate a Conversation
      description: Opens a new conversation session backed by a Custom Agent. Returns the conversationId required for the streaming endpoint.
      operationId: initiateConversation
      tags:
        - Conversations
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitiateConversationRequest'
            example:
              name: Data Summary Request
              active: true
              scope: PRIVATE
              userId: 371
              agentType: CustomAgent
              uiMetadata:
                type: CustomAgent
                parameters:
                  customAgentId: 1526da2b-3264-4118-b141-87857369b0bd
                  parameters:
                    customAgentId: 1526da2b-3264-4118-b141-87857369b0bd
                configuration:
                  llmModel: gpt-5.2
      responses:
        '200':
          description: Conversation created. Contains conversationId for the streaming endpoint.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: conversationId — pass to the streaming endpoint.
                  name:
                    type: string
                  scope:
                    type: string
                  agentType:
                    type: string
                  active:
                    type: boolean
  /ai/api/v2/messages/streaming:
    post:
      summary: Stream a Message to the Agent
      description: 'Sends a user message and streams the AI response as Server-Sent Events (SSE). This endpoint is on the AI Core service (testing-core-ai.datagol.ai). Requires the `credentials: include` header.'
      operationId: streamMessage
      tags:
        - Messaging
      servers:
        - url: https://testing-core-ai.datagol.ai
          description: AI Core service
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamingMessageRequest'
            example:
              agentType: CustomAgent
              type: CustomAgent
              conversationId: ae5ee879-e967-45e4-bca0-c6c78d10bd23
              message: Summarise the data
              parameters:
                customAgentId: 1526da2b-3264-4118-b141-87857369b0bd
              uiMetadata:
                parameters: {}
              selectedLlmModel: gpt-5.2
      responses:
        '200':
          description: SSE stream of delta tokens and tool call events. Parse events with `data:` prefix.
          content:
            text/event-stream:
              schema:
                type: string
  /ai/api/v1/builder/chat/complete:
    post:
      summary: Generate Conversation Name
      description: 'Step 3 in the conversation lifecycle. Generates a concise ≤5-word conversation name from the user''s first message using `gpt-4o-mini` and a structured tool call. Called client-side the moment the user submits their first message — before the conversation record is created — so the UI can display a meaningful title immediately. The `generate_conversation_name` tool is forced via `tool_choice: auto`.'
      operationId: generateConversationName
      tags:
        - Messaging
      servers:
        - url: https://testing-core-ai.datagol.ai
          description: AI Core service
      parameters:
        - name: resourceType
          in: query
          required: true
          schema:
            type: string
            enum:
              - CUSTOM_AGENT
          example: CUSTOM_AGENT
        - name: resourceId
          in: query
          required: true
          schema:
            type: string
            format: uuid
          description: UUID of the Custom Agent.
          example: 1526da2b-3264-4118-b141-87857369b0bd
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                model:
                  type: string
                  example: gpt-4o-mini
                messages:
                  type: array
                  items:
                    type: object
                tools:
                  type: array
                  items:
                    type: object
                tool_choice:
                  type: string
                  example: auto
      responses:
        '200':
          description: Tool call response containing the generated conversation_name.
tags:
  - name: Custom Agents
    description: Create, read, and manage Custom AI Agents.
  - name: Permissions
    description: View and manage who has access to an agent.
  - name: Conversations
    description: Open and list conversation sessions backed by an agent.
  - name: Messaging
    description: Send messages and stream AI responses.
  - name: Reference Data
    description: Lookup APIs for workspaces, connectors, and team members used when building agent configs.
