  /ai/api/v2/messages/streaming:
    post:
      summary: Stream a Message to the Agent
      description: 'Sends a user message and streams the AI response as Server-Sent Events (SSE). This endpoint is on the AI Core service (ai.datagol.ai).'
      operationId: streamMessage
      tags:
        - Messaging
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/StreamingMessageRequest'
            example:
              agentType: CustomAgent
              type: CustomAgent
              conversationId: ae5ee879-e967-45e4-bca0-c6c78d10bd23
              message: Summarise the data
              parameters:
                customAgentId: 1526da2b-3264-4118-b141-87857369b0bd
              selectedLlmModel: gpt-5.2
      responses:
        '200':
          description: |
            Below is the mapping of each event type, its structure, and required frontend handling.
            
            | Response Type (`response_type`) | Content Structure (`content`) | Frontend Behavior & Handling Rules |
            | :--- | :--- | :--- |
            | **`message_id`** | `integer` (e.g., `7903`) | **First event of every agent turn.** Provides the server-assigned numeric ID. Stash it if you need a handle; otherwise, safely ignore it. |
            | **`text`** | `string` (Markdown chunk) | **Streaming text chunk.** Delivered incrementally. **Append** each chunk to the in-progress message; do not replace it. |
            | **`tool_call`** | `object` (`{action, input, tool_call_id}`) | **Agent invoking a tool.** Render an inline "running tool..." indicator in the UI. Track `tool_call_id`. |
            | **`subagent_task_end`** | `object` (`{tool_call_id, tool_response}`) | **Tool finished.** Match `tool_call_id` to stop the spinner. <br><br>**CRITICAL:** `tool_response[0].text` is a **double-encoded JSON string**. You must call `JSON.parse()` a *second* time to extract the actual structured payload. |
            | **`html`** | `string` (HTML/SVG fragment) | **Rich visualization.** <br><br>**SECURITY RULE:** Render this content strictly inside a sandboxed `<iframe srcdoc="...">` so encapsulated styles do not leak. **Do not** inject via `dangerouslySetInnerHTML`. |
            | *(Any other type)* | *Varies / Unknown* | **Forward-compatibility.** Safely ignore unlisted types to prevent application crashes as new events are introduced. |
          content:
            text/event-stream:
              schema:
                $ref: '#/components/schemas/StreamEvent'
              examples:
                message_id:
                  summary: Turn starts — server assigns a message id
                  value: |
                    data: {"response_type":"message_id","content":7903}
                text_chunk:
                  summary: Incremental assistant text chunk
                  value: |
                    data: {"response_type":"text","content":"Here is a summary of the top 5 customers:\n\n"}
                tool_call:
                  summary: Agent invokes an MCP tool
                  value: |
                    data: {"response_type":"tool_call","content":{"action":"sales-activity_get_table_schema","input":{"workbook_id":"ca45078d-ed26-4752-a7a7-4aed24af033c"},"tool_call_id":"toolu_01XJ5vBNkPboGSf3iD8Vpxyz"}}
                subagent_task_end:
                  summary: Tool result returned (tool_response[0].text is double-JSON-encoded)
                  value: |
                    data: {"response_type":"subagent_task_end","content":{"tool_call_id":"toolu_01XJ5vBNkPboGSf3iD8Vpxyz","tool_response":[{"type":"text","text":"{\"columns\":[{\"id\":\"col_1\",\"title\":\"order_id\",\"type\":\"TEXT\"}],\"primaryKeyColumnName\":\"col_1\"}"}]}}
                html_visualization:
                  summary: Rich HTML chart or table visualization
                  value: |
                    data: {"response_type":"html","content":"<div style=\"font-family:sans-serif\"><table><thead><tr><th>Customer</th><th>Revenue</th></tr></thead><tbody><tr><td>Acme Corp</td><td>$1,200,000</td></tr></tbody></table></div>"}
  /conversations/{conversationId}/messages:
    get:
      summary: Get Conversation Messages
      description: Retrieves a chronologically ordered list of user messages, AI responses, and deep system agent routing execution data for a specific conversation thread.
      operationId: getConversationMessages
      tags:
        - Messaging
      parameters:
        - name: conversationId
          in: path
          required: true
          description: The unique UUID identifying the conversation thread.
          schema:
            type: string
            format: uuid
            example: 6718e680-194b-47fb-b8f6-029b35565b99
      responses:
        '200':
          description: A JSON array containing the message history list along with agent analytics metadata.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/ConversationMessage'
              example:
                - id: 7902
                  conversationId: "c920e1f5-2ac7-4f17-aed7-b260e464c022"
                  userId: 206
                  userQuery: "Can you do a RFM analysis on this data?"
                  modelResponse:
                    - code: null
                      data: "Here’s the plan and step-by-step pseudo-code for the RFM analysis, followed by a complete, executable Python script...\n\n```python\nimport pandas as pd\nimport numpy as np..."
                      type: "TEXT"
                      state: null
                      message: null
                      metadata: null
                  uiMetadata: null
                  messageMetadata:
                    chainId: "1762280699"
                    agentType: "NewPythonAgent"
                    workbookId: null
                    executionData:
                      - content: "<table class=\"dataframe dataframe\">\n  <thead>\n    <tr style=\"text-align: right;\">\n      <th>user_id</th>\n      <th>email</th>\n      <th>full_name</th>..."
                        response_type: "dataframe"
                      - content:
                          agent: "Expert Selector"
                          model: "o4-mini"
