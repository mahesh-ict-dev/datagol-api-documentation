        \ --- | --- |\n| ids | array of strings | ✅ Yes | List of folder or file\
        \ IDs to delete |\n\n---\n\n## 7️⃣ Example Request\n\n``` bash\ncurl --location\
        \ --request DELETE 'https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/folder'\
        \ \\\n--header 'Authorization: Bearer <token>' \\\n--data-raw '{\"ids\":[\"d287afa7-2006-4a91-ae24-03a548d0b58f\"]}'\n\
        \n ```\n\n---\n\n## 8️⃣ Behavior Summary\n\n``` id=\"behdf1\"\nDeletes one\
