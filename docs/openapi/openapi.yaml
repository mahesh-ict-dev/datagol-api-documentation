                    type: array
                    items: {}
                    description: List of child folders or files nested under this folder
                    example: []
                  uiMetadata:
                    type: object
                    description: Additional UI-level metadata associated with the folder
                    example: {}


      tags:
        - Enterprise Search
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nCreates a new folder\
        \ inside a workspace.\n\nSupports nested folder creation by passing a `parentId`.\n\
        \n---\n\n## 2️⃣ Endpoint\n\n``` bash\nPOST /noCo/api/v2/workspaces/{workspaceId}/folder\n\
        \n ```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type |\
        \ Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | string\
        \ | ✅ Yes | The ID of the workspace where the folder will be created |\n\
        \n---\n\n## 4️⃣ Authentication\n\nRequires authentication using:\n\
        \n``` bash\nAuthorization: Bearer <token>\n\n ```\n\n---\n\n## 5️⃣\
        \ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization\
        \ | ✅ Yes |\n\n---\n\
        \n## 6️⃣ Request Body\n\n| Field | Type | Required | Description\
        \ |\n| --- | --- | --- | --- |\n| name | string | ✅ Yes | Name of the\
        \ folder to create |\n| parentId | string | ❌ No | ID of the parent folder\
        \ for nested creation. Pass `null` for a root-level folder |\n\n---\n\n## 7️\
        ⃣ Example Request\n\n``` bash\ncurl --location 'https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/folder'\
        \ \\\n--header 'Authorization: Bearer <token>' \\\n--data-raw '{\"name\":\"test folder\",\"parentId\"\
        :null}'\n\n ```\n\n---\n\n## 8️⃣ Behavior Summary\n\n``` id=\"behcf1\"\
        \nCreates a new folder in the specified workspace.\nReturns the created folder\
        \ object including its generated id.\nTo create a nested folder, set parentId\
        \ to the id of an existing folder.\nPass parentId as null to create a root-level\
        \ folder.\n\n ```"
    delete:
      summary: Delete Folders or Files
