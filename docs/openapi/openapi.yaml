                  type: string
                  description: Display name of the folder to create
                  example: 'test folder'
                parentId:
                  type: string
                  nullable: true
                  description: ID of the parent folder for nested creation. Pass null to create a root-level folder
                  example: xxxx-xxxx-xxxx
            example:
              name: test folder
              parentId: null
      responses:
        '200':
          description: Create Folder
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: Unique identifier of the created folder
                    example: 'd287afa7-2006-4a91-ae24-03a548d0b58f'
                  name:
                    type: string
                    description: Display name of the folder
                    example: 'test folder'
                  isFolder:
                    type: boolean
                    description: Always true for folder objects
