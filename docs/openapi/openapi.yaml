  /dataPipeline/api/v2:
    post:
      summary: Create Data Pipeline
      security:
        - bearerAuth: [ ]
      tags:
        - Data Pipelines
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataPipelineRequest'
            examples:
              sqlPipeline:
                summary: SQL pipeline, every 6 hours
                value:
                  name: daily_orders_rollup
                  description: Aggregates orders per customer
                  type: CUSTOM
                  queryEngine: SPARK
                  scheduleType: CRON
                  schedule:
                    cronExpression: 0 0 */6 ? * *
                  destination:
                    id: 4521
                  streams:
                    - name: orders_by_customer
                      outputTableName: orders_by_customer
                      query: SELECT customer_id, COUNT(*) AS order_count, SUM(amount) AS total FROM sales_pg.public.orders GROUP BY customer_id
                      syncMode: FULL_REFRESH
                      executionType: SQL
                  syncNow: false
              pythonPipeline:
                summary: Python pipeline, run on demand
                value:
                  name: enrich_leads
                  type: CUSTOM
                  scheduleType: MANUAL
                  streams:
                    - name: enrich_leads
                      executionType: PYTHON
                      script: "print('hello')"
                      scriptTimeoutSeconds: 600
      responses:
        '200':
          description: The created pipeline
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataPipeline'
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Creates a data pipeline that reads from one or more data sources, transforms the data with SQL (or a Python script) and writes the result to a destination table. A pipeline can run on demand, on a cron, every N hours, or as a node in a DAG.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /dataPipeline/api/v2
        ```

        ---

        ## 3️⃣ Authentication

        ``` bash
        Authorization: Bearer <token>
        ```

        ---

        ## 4️⃣ Required Permissions

        - Lakehouse member
        - `EDITOR` on the destination data source
        - `VIEWER` on every source referenced by the query

        ---

        ## 5️⃣ Field Descriptions

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | name | string | ✅ Yes | Pipeline name |
        | type | enum | ✅ Yes | Pipeline type (see notes) |
        | description | string | ❌ No | Free-text description |
        | destination.id | int64 | ⚠️ Conditional | Data source to write output to. Required for SQL pipelines. |
        | streams | array | ✅ Yes | One entry per output table (see below) |
        | queryEngine | enum | ❌ No | Engine that runs the query (see notes) |
        | scheduleType | enum | ❌ No | `MANUAL` (default), `CRON`, `SCHEDULED`, `DATA_CHANGE` |
        | schedule | object | ⚠️ Conditional | Schedule settings (see below) |
        | parameters | object | ❌ No | Defaults for `{{param}}` placeholders |
        | syncNow | boolean | ❌ No | `true` runs the pipeline right after creation |

        **Notes**

        - **type** — `CUSTOM` (SQL or Python), `STANDARD` (copy tables) or `DEDUP`.
        - **queryEngine** — `SPARK` (default), `ATHENA`, `SNOWFLAKE`, `BIGQUERY`, `CLOUD_BIGQUERY`, and more. See **List Query Engines**.

        ### Schedule fields

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | cronExpression | string | When `CRON` | Quartz cron, seconds first, e.g. `0 0 */6 ? * *` |
        | basicSchedule.units | string | When `SCHEDULED` | Every N hours: `1`, `2`, `3`, `6`, `8`, `12`, `24` |
        | basicSchedule.timeUnit | enum | When `SCHEDULED` | `HOURS` |

        ### Stream fields

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | name | string | ✅ Yes | Stream name |
        | outputTableName | string | ✅ Yes | Output table name (see notes) |
        | query | string | ⚠️ Conditional | SQL `SELECT`. Required for SQL streams. |
        | syncMode | enum | ❌ No | How output is written (see notes) |
        | uniqueColumns | string[] | ⚠️ Conditional | Key columns. Required for merge modes. |
        | cursor.cursorName | string | ⚠️ Conditional | Column that marks new rows. Required for incremental modes. |
        | executionType | enum | ❌ No | `SQL` (default) or `PYTHON` |
        | script | string | ⚠️ Conditional | Python source. Required when `PYTHON`. |
        | scriptTimeoutSeconds | integer | ❌ No | Python timeout in seconds, > 0 |

        **Notes**

        - **outputTableName** — Letters, digits and `_`, max 128 chars. Must be unique per destination.
        - **query** — Reference tables as `<dataSourceName>.<schema>.<table>`.
        - **syncMode** — `FULL_REFRESH` (default), `INCREMENTAL_APPEND`, `INCREMENTAL_APPEND_V2`, `INCREMENTAL_APPEND_MERGE` or `INCREMENTAL_APPEND_V2_MERGE`.

        > For SQL pipelines you do not send `sources` — they are derived from the query.

        ---

        ## 6️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/dataPipeline/api/v2' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "daily_orders_rollup",
          "type": "CUSTOM",
          "scheduleType": "CRON",
          "schedule": { "cronExpression": "0 0 */6 ? * *" },
          "destination": { "id": 4521 },
          "streams": [{
            "name": "orders_by_customer",
            "outputTableName": "orders_by_customer",
            "query": "SELECT customer_id, COUNT(*) AS order_count FROM sales_pg.public.orders GROUP BY customer_id",
            "syncMode": "FULL_REFRESH"
          }]
        }'
        ```

        ---

        ## 7️⃣ Validation

        | Rejected with 400 when |
        | --- |
        | `streams` is an empty list, or a SQL stream has no `query` |
        | `outputTableName` has invalid characters or already exists for the destination |
        | `cronExpression` is not a valid Quartz cron |
        | The query is not a plain `SELECT` |
        | `syncMode` is not supported by the destination (SQL-database destinations allow only `FULL_REFRESH`) |

        ---

        ## 8️⃣ Behavior Summary

        ```
        If queryEngine is not enabled for your company, SPARK is used.
        With syncNow=true the first run starts asynchronously; poll the pipeline for its jobs.
        ```
