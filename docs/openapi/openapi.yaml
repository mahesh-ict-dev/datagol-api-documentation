        \ Authentication\n\nRequires authentication using:\n\n``` bash\nAuthorization:\
        \ Bearer <token>\n\n ```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header |\
        \ Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n\n---\n\n## 6️⃣\
        \ Request Body (multipart/form-data)\n\n| Field | Type | Required | Description\
        \ |\n| --- | --- | --- | --- |\n| files | file | ✅ Yes | The file(s) to\
        \ upload |\n| parentId | string | ❌ No | ID of the target folder. If omitted,\
        \ the file is uploaded to the workspace root |\n\n---\n\n## 7️⃣ Example\
        \ Request\n\n``` bash\ncurl --location 'https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/folder/upload'\
        \ \\\n--header 'Authorization: Bearer <token>' \\\n--form 'files=@\"/path/to/file\"'\
        \ \\\n--form 'parentId=\"{folderId}\"'\n\n ```\n\n---\n\n## 8️⃣ Behavior\
        \ Summary\n\n``` id=\"behfu1\"\nUploads one or more files into the specified\
        \ folder within a workspace.\nReturns an array of uploaded file objects, each\
        \ containing the file id, name, type, size, and location metadata.\nIf parentId\
        \ is omitted, the file is placed at the workspace root level.\n\n ```"
