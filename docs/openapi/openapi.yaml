        Searches and filters pipelines with pagination, newest first.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /dataPipeline/api/v2/getAllPaginated?page=1&size=12
        ```

        ---

        ## 3️⃣ Request Body

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | searchString | string | ❌ No | Free-text search |
        | searchFilters | object | ✅ Yes (may be `{}`) | Filters — see below |
        | sortByField | string | ❌ No | `oldest` for oldest first |

        | Filter key | Values |
        | --- | --- |
        | TYPE | `CUSTOM`, `STANDARD`, `DEDUP`, `MV_PIPELINE` |
        | STATUS | Status of the latest job: `COMPLETED`, `FAILED`, `RUNNING`, ... |
        | CREATED_BY | User IDs |
        | SOURCE | Source provider names, e.g. `postgresql` |

        ---

        ## 4️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/dataPipeline/api/v2/getAllPaginated?page=1&size=12' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{ "searchString": "orders", "searchFilters": { "TYPE": ["CUSTOM"] } }'
        ```

        ---

        ## 5️⃣ Behavior Summary

        ```
        Archived and child pipelines are excluded.
        Note: page.pageNumber in the response is 0-based, while the page query parameter is 1-based.
        ```
