      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Searches DAGs by name or ID with pagination. Results are lightweight — they do not include nodes, edges or runs.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /orchestration/api/v1/dags/search?page=1&size=20
        ```

        ---

        ## 3️⃣ Query Parameters

        | Parameter | Type | Required | Description |
        | --- | --- | --- | --- |
        | page | integer | ❌ No | Page number, starting at 1 (default 1) |
        | size | integer | ❌ No | Page size (default 20) |

        ---

        ## 4️⃣ Request Body

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | searchString | string | ❌ No | Case-insensitive match on DAG name, or a match on DAG ID |

        Send `{}` to list all DAGs.

        ---

        ## 5️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/orchestration/api/v1/dags/search?page=1&size=20' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{ "searchString": "sales" }'
        ```

        ---

        ## 6️⃣ Behavior Summary

        ```
        The response is wrapped in the standard envelope: { success, version, date, data }.
        data.dags holds the page of DAGs; data.page holds the pagination totals.
        ```
