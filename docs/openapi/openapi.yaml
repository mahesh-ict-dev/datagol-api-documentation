        ```

        > This path has no `/dataSources` segment after `/v1`.

        ---

        ## 3️⃣ Status Values

        | Status | Meaning |
        | --- | --- |
        | RUNNING | A sync is in progress |
        | COMPLETED | The last sync succeeded |
        | FAILED | The last sync failed |
        | NOT_AVAILABLE | The source has never been synced |

