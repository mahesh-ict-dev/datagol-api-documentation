        - WorkBook
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nDeletes an existing column from
        a specified table within a workspace.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nDELETE
        /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/columns/{columnId}\n\n
  ````\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description
        |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier
        |\n| workbookId | UUID | ✅ Yes | Table identifier |\n| columnId | UUID | ✅
        Yes | Identifier of the column to delete |\n\n---\n\n## 4️⃣ Authentication\n\nRequires
        **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n\n ```\n\n---\n\n##
        5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization
        | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request
        Body\n\nNo request body required. The column to delete is identified entirely
        by the `columnId` path parameter.\n\n---\n\n## 7️⃣ Example Request\n\n``` bash\ncurl
        -X DELETE 'https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/columns/{columnId}'
        \\\n-H 'Authorization: Bearer <token>' \\\n-H 'Content-Type: application/json'\n\n
  ```\n\n---\n\n## 8️⃣ Behavior Summary\n\n``` id=\"behcol4\"\nDeletes a column
        from the specified workbook table.\nValidation Rules:\n• workspaceId, workbookId,
        and columnId must all be valid  \n• User must have delete permission on the
        column  \n• System-generated or formula columns may not be deletable  \n• Deletion
        is permanent — column data cannot be recovered  \n\n ```"
    parameters:
      - name: workspaceId
        in: path
        required: true
        schema:
          type: string
        example: '{{workspaceId}}'
      - name: workbookId
        in: path
        required: true
        schema:
          type: string
        example: '{{workbookId}}'
      - name: columnId
        in: path
        required: true
        schema:
          type: string
        example: '{{columnId}}'
  /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/column:
    post:
      summary: Create Link Column (Manual-Link)
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nCreates a new LINK type column in a table, establishing a bidirectional relationship between a parent table and a child/associated table.\n\nThis endpoint supports:\n- Creating HAS_MANY, ONE_TO_ONE, and MANY_TO_MANY relation types\n- Automatically creating a reciprocal link column in the associated table\n\n> ⚠️ **Note:** Links are bidirectional. When a link is created from the parent with relation type `HAS_MANY`, a corresponding column with relation type `BELONGS_TO` is automatically created in the child table.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/column\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| tableId | UUID | ✅ Yes | Source (parent) table identifier |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n{\n  \"uiDataType\": \"LINK\",\n  \"colOptions\": {\n    \"relationType\": \"HAS_MANY\",\n    \"associateTableId\": \"uuid\",\n    \"associateWorkspaceId\": \"uuid\"\n  },\n  \"uiMetadata\": {\n    \"title\": \"string\"\n  },\n  \"settings\": {},\n  \"name\": \"string\"\n}\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| uiDataType | string | ✅ Yes | Must be `LINK` |\n| colOptions | object | ✅ Yes | Link settings (see below) |\n| uiMetadata.title | string | ✅ Yes | Display name shown in the UI |\n| name | string | ✅ Yes | Internal column name, unique within the table |\n\n### colOptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| relationType | string | ✅ Yes | `HAS_MANY`, `ONE_TO_ONE` or `MANY_TO_MANY` |\n| associateTableId | UUID | ✅ Yes | Linked (child) table ID |\n| associateWorkspaceId | UUID | ✅ Yes | Workspace of the linked table |\n\n---\n\n## 8️⃣ Example Request\n\n```bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/column \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n-d '{\n  \"uiDataType\": \"LINK\",\n  \"colOptions\": {\n    \"relationType\": \"HAS_MANY\",\n    \"associateTableId\": \"6a175502-6458-4314-b4c5-3c2f29626dea\",\n    \"associateWorkspaceId\": \"b3e1a902-1234-4abc-9def-7f8a90bc1234\"\n  },\n  \"uiMetadata\": {\n    \"title\": \"people\"\n  },\n  \"name\": \"people\"\n}'\n```\n\n---\n\n## 9️⃣ Behavior Summary\n\n```\nCreates a LINK column in the source table.\nSupports:\n• HAS_MANY, ONE_TO_ONE, and MANY_TO_MANY relation types\n• Bidirectional — a BELONGS_TO column is auto-created in the child table\n• Column name must be unique within the table\n• Returns the full column object including colOptions with resolved IDs\n```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Source (parent) table identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uiDataType
                - colOptions
                - uiMetadata
                - name
              properties:
                uiDataType:
                  type: string
                  enum: [ LINK ]
                colOptions:
                  type: object
                  required:
                    - relationType
                    - associateTableId
                    - associateWorkspaceId
                  properties:
                    relationType:
                      type: string
                      enum: [ HAS_MANY, ONE_TO_ONE, MANY_TO_MANY ]
                    associateTableId:
                      type: string
                      format: uuid
                    associateWorkspaceId:
                      type: string
                      format: uuid
                uiMetadata:
                  type: object
                  properties:
                    title:
                      type: string
                name:
                  type: string
            example:
              uiDataType: LINK
              colOptions:
                relationType: HAS_MANY
                associateTableId: 6a175502-6458-4314-b4c5-3c2f29626dea
                associateWorkspaceId: b3e1a902-1234-4abc-9def-7f8a90bc1234
              uiMetadata:
                title: people
              name: people
      responses:
        '200':
          description: Link column created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the created link column
                  name:
                    type: string
                    description: Internal column name, unique within the table
                  uiDataType:
                    type: string
                    description: Always returns `LINK` for link columns
                  colOptions:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the colOptions record
                      relationType:
                        type: string
                        description: "Relation type — HAS_MANY, ONE_TO_ONE, or MANY_TO_MANY"
                      columnId:
                        type: string
                        format: uuid
                        description: ID of the link column in the source (parent) table
                      associatedColumnId:
                        type: string
                        format: uuid
                        description: ID of the auto-created reciprocal column in the child table
                      tableId:
                        type: string
                        format: uuid
                        description: Source table ID where the link column was created
                      associateTableId:
                        type: string
                        format: uuid
                        description: Destination (child) table ID
                      associateWorkspaceId:
                        type: string
                        format: uuid
                        description: Workspace ID of the destination (child) table
                      childColumnId:
                        type: string
                        format: uuid
                        description: ID of the primary key column in the child (destination) table, used to establish the foreign key relationship.
                      parentColumnId:
                        type: string
                        format: uuid
                        description: ID of the primary key column in the parent (source) table, used to establish the foreign key relationship.
                      isItSource:
                        type: boolean
                        description: True if this column is the source side of the relationship
                  uiMetadata:
                    type: object
                    properties:
                      title:
                        type: string
                        description: Display name shown in the UI
                example:
                  id: 21224153-2f85-4b24-a306-4cfbc7e73f70
                  name: people
                  uiDataType: LINK
                  colOptions:
                    id: 28dde853-fc6e-4983-8121-b013f2b85e80
                    relationType: HAS_MANY
                    columnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
                    associatedColumnId: 518e2dfc-f8c9-459e-ac7e-99f3daa6d773
                    tableId: 2815ed2f-5acc-400d-94a9-ae5596da2c37
                    associateTableId: 6a175502-6458-4314-b4c5-3c2f29626dea
                    associateWorkspaceId: b3e1a902-1234-4abc-9def-7f8a90bc1234
                    childColumnId: d1d1e3f0-8a3f-48e5-b93e-9e3f3d1ef4ff
                    parentColumnId: 9f642d9c-54ae-4801-95fe-e83e452b5b4b
                    isItSource: true
                  uiMetadata:
                    title: people
  /noCo/api/v2/workspaces/{workspace_id}/tables/{table_id}/column:
    post:
      summary: Create Link Column with Auto Join Condition
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nCreates a new LINK type column with an automatic join condition between the parent and child tables. Unlike a manual link, this allows defining column-level join conditions that filter how records are linked.\n\nThis endpoint supports:\n- Defining join conditions between columns of two tables\n- Using operators like `EQUALS` for condition matching\n- Passing a raw SQL-style `whereClause` and `formula` for backend filtering\n\n---\n\n## 2️⃣ Endpoint\n\n```\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/column\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| tableId | UUID | ✅ Yes | Source (parent) table identifier |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n{\n  \"uiDataType\": \"LINK\",\n  \"colOptions\": {\n    \"associateTableId\": \"uuid\",\n    \"associateWorkspaceId\": \"uuid\",\n    \"whereClause\": \"string\"\n  },\n  \"uiMetadata\": {\n    \"title\": \"string\",\n    \"autoJoinConfig\": {\n      \"joinConditions\": [\n        {\n          \"id\": \"string\",\n          \"currentTableColumn\": \"string\",\n          \"linkedTableColumn\": \"string\",\n          \"operator\": \"EQUALS\"\n        }\n      ],\n      \"isSwapped\": false\n    }\n  },\n   \"formula\": \"string\",\n  \"name\": \"string\"\n}\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| uiDataType | string | ✅ Yes | Must be `LINK` |\n| colOptions | object | ✅ Yes | Link settings (see below) |\n| uiMetadata.title | string | ✅ Yes | Display name shown in the UI |\n| uiMetadata.autoJoinConfig | object | ✅ Yes | Auto join settings (see below) |\n| formula | string | ✅ Yes | SQL-style formula matching `whereClause` |\n| name | string | ✅ Yes | Internal column name, unique within the table |\n\n### colOptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| associateTableId | UUID | ✅ Yes | Linked (child) table ID |\n| associateWorkspaceId | UUID | ✅ Yes | Workspace of the linked table |\n| whereClause | string | ✅ Yes | SQL-style join condition |\n\n### uiMetadata.autoJoinConfig\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| joinConditions | array | ✅ Yes | Join conditions (see below) |\n| isSwapped | boolean | ❌ No | Swap the join direction. Default `false`. |\n\n### joinConditions[] items\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| id | string | ✅ Yes | Client-generated condition ID |\n| currentTableColumn | string | ✅ Yes | Column in the current (source) table |\n| linkedTableColumn | string | ✅ Yes | Column in the linked table |\n| operator | string | ✅ Yes | Only `EQUALS` is supported |"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Source (parent) table identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - uiDataType
                - colOptions
                - uiMetadata
                - formula
                - name
              properties:
                uiDataType:
                  type: string
                  enum: [ LINK ]
                colOptions:
                  type: object
                  required:
                    - associateTableId
                    - associateWorkspaceId
                    - whereClause
                  properties:
                    associateTableId:
                      type: string
                      format: uuid
                      description: The child or linked table ID
                    associateWorkspaceId:
                      type: string
                      format: uuid
                      description: The workspace ID of the child (associated) table
                    whereClause:
                      type: string
                      description: Raw SQL-style condition used for backend join filtering
                uiMetadata:
                  type: object
                  required:
                    - title
                    - autoJoinConfig
                  properties:
                    title:
                      type: string
                      description: Display name shown in the UI
                    autoJoinConfig:
                      type: object
                      properties:
                        joinConditions:
                          type: array
                          items:
                            type: object
                            properties:
                              id:
                                type: string
                                description: Unique identifier for the condition (client-generated)
                              currentTableColumn:
                                type: string
                                description: Column name from the current (source) table to join on
                              linkedTableColumn:
                                type: string
                                description: Column name from the linked (destination) table to join on
                              operator:
                                type: string
                                enum: [ EQUALS ]
                                description: Join operator
                        isSwapped:
                          type: boolean
                          description: Whether the join direction is swapped. Defaults to false
                formula:
                  type: string
                  description: Raw SQL-style formula matching the whereClause, used for backend processing
                name:
                  type: string
                  description: Internal column name — must be unique within the table
            example:
              uiDataType: LINK
              colOptions:
                associateTableId: 6d85b345-b626-4b87-b664-66237d7333e8
                associateWorkspaceId: b3e1a902-1234-4abc-9def-7f8a90bc1234
                whereClause: table_1e67d485."course_taken" = table_c8be6d9c."status"
              uiMetadata:
                title: product link column
                autoJoinConfig:
                  joinConditions:
                    - id: condition-1774312716137
                      currentTableColumn: course_taken
                      linkedTableColumn: status
                      operator: EQUALS
                  isSwapped: false
              formula: table_1e67d485."course_taken" = table_c8be6d9c."status"
              name: product_link_column
      responses:
        '200':
          description: Link column with auto join condition created successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    format: uuid
                    description: Unique identifier of the created link column
                  name:
                    type: string
                    description: Internal column name, unique within the table
                  uiDataType:
                    type: string
                    description: Always returns `LINK` for link columns
                  formula:
                    type: string
                    description: Raw SQL-style formula used for the join condition
                  backendDataType:
                    type: string
                    description: Underlying database data type assigned to the column
                  workspaceId:
                    type: string
                    format: uuid
                    description: Workspace this column belongs to
                  colOptions:
                    type: object
                    properties:
                      id:
                        type: string
                        format: uuid
                        description: Unique identifier of the colOptions record
                      relationType:
                        type: string
                        description: Relation type resolved by the server — HAS_MANY, ONE_TO_ONE, or MANY_TO_MANY
                      columnId:
                        type: string
                        format: uuid
                        description: ID of the link column in the source (parent) table
                      associatedColumnId:
                        type: string
                        format: uuid
                        description: ID of the auto-created reciprocal column in the child table
                      tableId:
                        type: string
                        format: uuid
                        description: Source table ID where the link column was created
                      associateTableId:
                        type: string
                        format: uuid
                        description: Destination (child) table ID
                      associateWorkspaceId:
                        type: string
                        format: uuid
                        description: Workspace ID of the destination (child) table
                      childColumnId:
                        type: string
                        format: uuid
                        description: ID of the primary key column in the child (destination) table, used to establish the foreign key relationship
                      parentColumnId:
                        type: string
                        format: uuid
                        description: ID of the primary key column in the parent (source) table, used to establish the foreign key relationship
                      whereClause:
                        type: string
                        description: Raw SQL-style condition used for backend join filtering
                      isItSource:
                        type: boolean
                        description: True if this column is the source side of the relationship
                  uiMetadata:
                    type: object
                    properties:
                      title:
                        type: string
                        description: Display name shown in the UI
                      autoJoinConfig:
                        type: object
                        properties:
                          joinConditions:
                            type: array
                            items:
                              type: object
                              properties:
                                id:
                                  type: string
                                currentTableColumn:
                                  type: string
                                linkedTableColumn:
                                  type: string
                                operator:
                                  type: string
                          isSwapped:
                            type: boolean
                  tableId:
                    type: string
                    format: uuid
                    description: Table ID where this column resides
              example:
                id: efdbce09-6581-4811-aa67-14344e7444b7
                name: product link column
                uiDataType: LINK
                formula: table_1e67d485."course_taken" = table_c8be6d9c."status"
                backendDataType: VARCHAR(255)
                workspaceId: 16231f3f-8208-4c51-a460-87d17244344f
                colOptions:
                  id: e19ab19c-3a38-4d28-9eff-767019524186
                  relationType: MANY_TO_MANY
                  columnId: efdbce09-6581-4811-aa67-14344e7444b7
                  associatedColumnId: 9422e52d-9886-431e-946f-8ed5a8838dac
                  tableId: 9c8a448d-7884-4158-bfca-202bc95b0515
                  associateTableId: 6d85b345-b626-4b87-b664-66237d7333e8
                  associateWorkspaceId: b3e1a902-1234-4abc-9def-7f8a90bc1234
                  childColumnId: 75272cd2-63c4-4d4c-b2eb-20a864834a2a
                  parentColumnId: f830fd3f-8624-4ae5-959f-36f1756d828a
                  whereClause: table_1e67d485."course_taken" = table_c8be6d9c."status"
                  isItSource: true
                uiMetadata:
                  title: product_link_column
                  autoJoinConfig:
                    joinConditions:
                      - id: condition-1774312716137
                        currentTableColumn: course_taken
                        linkedTableColumn: status
                        operator: EQUALS
                    isSwapped: false
                tableId: 9c8a448d-7884-4158-bfca-202bc95b0515

  /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/columns:
    post:
      summary: Add Lookup Column
      tags:
        - Links & Joins
      security:
        - bearerAuth: []
      description: "## 1️⃣ Overview\n\n**Purpose:**\nAdds one or more LOOKUP type columns to a specified table. A lookup column pulls field values from a linked (associated) table via an existing LINK column.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/columns\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| tableId | UUID | ✅ Yes | Table identifier where the lookup column will be created |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n{\n  \"columns\": [\n    {\n      \"description\": \"string\",\n      \"uiMetadata\": {\n        \"title\": \"string\"\n      },\n      \"uiDataType\": \"LOOKUP\",\n      \"colOptions\": {\n        \"linkColumnId\": \"uuid\",\n        \"lookupColumnId\": \"uuid\"\n      },\n      \"name\": \"string\"\n    }\n  ]\n}\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| columns | array | ✅ Yes | Lookup columns to create (see below) |\n\n### columns[] items\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| uiDataType | string | ✅ Yes | Must be `LOOKUP` |\n| uiMetadata.title | string | ✅ Yes | Display name shown in the UI |\n| colOptions.linkColumnId | UUID | ✅ Yes | Existing LINK column in this table |\n| colOptions.lookupColumnId | UUID | ✅ Yes | Column in the linked table to show |\n| name | string | ✅ Yes | Internal column name, unique within the table |\n| description | string | ❌ No | Column description |\n\n---\n\n## 8️⃣ Example Request\n\n```bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/columns \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n-d '{\n  \"columns\": [\n    {\n      \"description\": \"\",\n      \"uiMetadata\": {\n        \"title\": \"Name (from People)\"\n      },\n      \"uiDataType\": \"LOOKUP\",\n      \"colOptions\": {\n        \"linkColumnId\": \"21224153-2f85-4b24-a306-4cfbc7e73f70\",\n        \"lookupColumnId\": \"9b5e408d-69bb-42ca-8fa4-ba00f7994356\"\n      },\n      \"name\": \"name_1774285509977\"\n    }\n  ]\n}'\n```\n\n---\n\n## 9️⃣ Behavior Summary\n\n```\nCreates one or more LOOKUP columns in the target table.\nSupports:\n• Batch creation of multiple lookup columns in one request\n• linkColumnId — references the existing LINK column in the current table\n• lookupColumnId — references the column from the linked table to display\n• Column name must be unique within the table\n```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Table identifier where the lookup column will be created
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - columns
              properties:
                columns:
                  type: array
                  items:
                    type: object
                    required:
                      - uiDataType
                      - uiMetadata
                      - colOptions
                      - name
                    properties:
                      description:
                        type: string
                      uiMetadata:
                        type: object
                        properties:
                          title:
                            type: string
                      uiDataType:
                        type: string
                        enum: [LOOKUP]
                      colOptions:
                        type: object
                        required:
                          - linkColumnId
                          - lookupColumnId
                        properties:
                          linkColumnId:
                            type: string
                            format: uuid
                            description: ID of the existing LINK column in the current table
                          lookupColumnId:
                            type: string
                            format: uuid
                            description: ID of the column in the linked table to look up
                      name:
                        type: string
            example:
              columns:
                - description: ""
                  uiMetadata:
                    title: lookup column
                  uiDataType: LOOKUP
                  colOptions:
                    linkColumnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
                    lookupColumnId: 9b5e408d-69bb-42ca-8fa4-ba00f7994356
                  name: lookup_column
      responses:
        '200':
          description: Lookup column(s) created successfully
  /noCo/api/v2/workspaces/{workspaceId}/tables/{workbook_id}/rows:
    post:
      summary: Add Row with Linked Records
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nCreates a new row in the specified table and simultaneously links it to one or more records in associated tables via existing LINK columns.\n\nThis endpoint supports:\n- Setting cell values for the new row at creation time\n- Linking the new row to existing records in associated tables using `linkColumnId`\n- Multiple link relations can be established in a single request\n\n---\n\n## 2️⃣ Endpoint\n\n```\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{workbook_id}/rows\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| workbook_id | UUID | ✅ Yes |  workbook where the row will be created |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n{\n  \"cellValues\": {\n    \"<columnName>\": \"<value>\"\n  },\n  \"linkRecords\": [\n    {\n      \"destinationRecordId\": \"integer\",\n      \"linkColumnId\": \"uuid\"\n    }\n  ]\n}\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| cellValues | object | ✅ Yes | Column name → value for the new row |\n| cellValues.\\<columnName\\> | any | ❌ No | Column value. Use `\"\"` or `[]` for empty. |\n| linkRecords | array | ❌ No | Records to link (see below) |\n\n### linkRecords[] items\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| destinationRecordId | integer | ✅ Yes | Row ID in the linked table |\n| linkColumnId | UUID | ✅ Yes | LINK column that defines the relation |"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: workbook_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Target table identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - cellValues
              properties:
                cellValues:
                  type: object
                  description: Key-value map of column names and their initial values for the new row
                  additionalProperties:
                    oneOf:
                      - type: string
                      - type: array
                        items:
                          type: string
                linkRecords:
                  type: array
                  description: List of link operations to attach when creating the row
                  items:
                    type: object
                    required:
                      - destinationRecordId
                      - linkColumnId
                    properties:
                      destinationRecordId:
                        type: integer
                        description: PK of the record in the associated table to link to
                      linkColumnId:
                        type: string
                        format: uuid
                        description: ID of the LINK column that defines the relation
            example:
              cellValues:
                name: ""
                notes: ""
              linkRecords:
                - destinationRecordId: 2
                  linkColumnId: "ed7584c6-a33a-4779-b7bb-03a5d1345bb2"
      responses:
        '200':
          description: Row created and linked successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: integer
                    description: Auto-generated primary key of the newly created row
                  cellValues:
                    type: object
                    description: The column values stored for the new row
                    additionalProperties:
                      oneOf:
                        - type: string
                        - type: array
                          items:
                            type: string
                  linkRecords:
                    type: array
                    description: Confirmation of link relations established
                    items:
                      type: object
                      properties:
                        destinationRecordId:
                          type: integer
                          description: PK of the linked record in the associated table
                        linkColumnId:
                          type: string
                          format: uuid
                          description: LINK column ID used to establish the relation
              example:
                id: 101
                cellValues:
                  name: ""
                  notes: ""
                linkRecords:
                  - destinationRecordId: 2
                    linkColumnId: "ed7584c6-a33a-4779-b7bb-03a5d1345bb2"
  /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/linkTables:
    get:
      summary: Get All Link Tables of Current Table
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nRetrieves all tables that are linked to a specified table within a workspace. Useful for discovering all relationships (link columns) associated with a table.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nGET /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/linkTables\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| tableId | UUID | ✅ Yes | Table identifier to query linked tables for |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Example Request\n\n```bash\ncurl -X GET https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/linkTables \\\n-H \"Authorization: Bearer <token>\"\n```\n\n---\n\n## 7️⃣ Behavior Summary\n\n```\nReturns all tables linked to the specified table.\nIncludes metadata about link columns and relation types.\n```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Table identifier to query linked tables for
      responses:
        '200':
          description: Linked tables retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      format: uuid
                      description: Unique identifier of the linked table
                    workspaceId:
                      type: string
                      format: uuid
                      description: Workspace this table belongs to
                    tableName:
                      type: string
                      description: Internal system name of the table
                    title:
                      type: string
                      description: Display name of the table shown in the UI
                    description:
                      type: string
                      description: Optional description of the table
                    columns:
                      type: array
                      description: List of all columns in the table including system-generated and user-defined columns
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                            description: Unique identifier of the column
                          name:
                            type: string
                            description: Internal column name
                          uiDataType:
                            type: string
                            description: UI data type — e.g. SINGLE_LINE_TEXT, NUMBER, DATE, USER, LINK, ID
                          backendDataType:
                            type: string
                            description: Underlying database data type
                          colOptions:
                            type: object
                            description: Link configuration if the column is of type LINK, otherwise empty
                            properties:
                              id:
                                type: string
                                format: uuid
                              relationType:
                                type: string
                                description: Relation type — HAS_MANY, ONE_TO_ONE, or MANY_TO_MANY
                              columnId:
                                type: string
                                format: uuid
                                description: ID of the link column in the source (parent) table
                              associatedColumnId:
                                type: string
                                format: uuid
                                description: ID of the auto-created reciprocal column in the child table
                              tableId:
                                type: string
                                format: uuid
                                description: Source table ID
                              associateTableId:
                                type: string
                                format: uuid
                                description: Destination (child) table ID
                              childColumnId:
                                type: string
                                format: uuid
                                description: ID of the primary key column in the child (destination) table, used to establish the foreign key relationship
                              parentColumnId:
                                type: string
                                format: uuid
                                description: ID of the primary key column in the parent (source) table, used to establish the foreign key relationship
                              whereClause:
                                type: string
                                description: Raw SQL-style join condition, present only for auto-join links
                              isItSource:
                                type: boolean
                                description: True if this column is the source side of the relationship
                          uiMetadata:
                            type: object
                            description: UI display metadata for the column
                            properties:
                              title:
                                type: string
                                description: Display name shown in the UI
                    views:
                      type: array
                      description: List of views defined on this table
                      items:
                        type: object
                        properties:
                          id:
                            type: string
                            format: uuid
                          name:
                            type: string
                            description: Display name of the view
                          type:
                            type: string
                            description: View type — e.g. GRID
                          isMaster:
                            type: boolean
                            description: True if this is the default master view
                          position:
                            type: integer
                            description: Display position of the view
              example:
                - id: 6d85b345-b626-4b87-b664-66237d7333e8
                  workspaceId: 16231f3f-8208-4c51-a460-87d17244344f
                  tableName: table_c8be6d9c
                  title: employee
                  description: ""
                  tableType: DYNAMIC
                  columns:
                    - id: 75272cd2-63c4-4d4c-b2eb-20a864834a2a
                      name: noco_87fee1b5
                      uiDataType: ID
                      backendDataType: BIGSERIAL
                    - id: f0f38619-4396-420f-aa20-5bf13bfac51c
                      name: course_name
                      uiDataType: SINGLE_LINE_TEXT
                      backendDataType: TEXT
                      required: false
                      description: ""
                      uiMetadata:
                        title: course name
                    - id: b83a3605-2996-4898-8f31-076d34e49424
                      name: course_1234
                      uiDataType: LINK
                      backendDataType: BIG SERIAL
                      colOptions:
                        id: f668c79a-11ca-4640-bcf9-ae214712f0a7
                        relationType: MANY_TO_MANY
                        columnId: b83a3605-2996-4898-8f31-076d34e49424
                        associatedColumnId: a19221ad-ef55-4de7-b9b3-2e6a05e3bd93
                        tableId: 6d85b345-b626-4b87-b664-66237d7333e8
                        associateTableId: 9c8a448d-7884-4158-bfca-202bc95b0515
                        childColumnId: 75272cd2-63c4-4d4c-b2eb-20a864834a2a
                        parentColumnId: f830fd3f-8624-4ae5-959f-36f1756d828a
                        isItSource: false
                      uiMetadata:
                        title: course
                  views:
                    - id: e5a120e8-fa3b-47cb-9773-7541aa4ec270
                      name: Grid View (Master)
                      type: GRID
                      isMaster: true
                      position: 0
  /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/linkRecordV2:
    post:
      summary: Link Records
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nLinks one or more records from a source table to records in a destination table via a LINK column. Supports batch linking of multiple record pairs in a single request.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/linkRecordV2\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| workbookId | UUID | ✅ Yes | Workbook identifier |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n[\n  {\n    \"sourceRecordId\": integer,\n    \"destinationRecordId\": integer,\n      \"linkColumnId\": \"uuid\"\n  }\n]\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| sourceRecordId | integer | ✅ Yes | Row ID in the current table |\n| destinationRecordId | integer | ✅ Yes | Row ID in the linked table |\n| linkColumnId | UUID | ✅ Yes | LINK column ID (see note) |\n\n> **linkColumnId** — The LINK column in the current table. For a LOOKUP column, use the ID of the LINK column it is based on.\n\n---\n\n## 8️⃣ Example Request\n\n```bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/linkRecordV2 \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n-d '[\n  {\n    \"sourceRecordId\": 1,\n    \"destinationRecordId\": 1,\n    \"linkColumnId\": \"21224153-2f85-4b24-a306-4cfbc7e73f70\"\n  },\n  {\n    \"sourceRecordId\": 1,\n    \"destinationRecordId\": 2,\n     \"linkColumnId\": \"21224153-2f85-4b24-a306-4cfbc7e73f70\"\n  }\n]'\n```\n\n---\n\n## 9️⃣ Behavior Summary\n\n```\nLinks records between two tables via a LINK column.\nSupports:\n• Batch linking multiple record pairs in one request\n• sourceRecordId — PK of the record in the current table\n• destinationRecordId — PK of the record in the destination table\n•  linkColumnId — the LINK column ID or link dataType columnId for LookUp\n```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: workbookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workbook identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - sourceRecordId
                  - destinationRecordId
                  - linkColumnId
                properties:
                  sourceRecordId:
                    type: integer
                    description: Primary key of the record in the current (source) table
                  destinationRecordId:
                    type: integer
                    description: Primary key of the record in the destination table
                  linkColumnId:
                    type: string
                    format: uuid
                    description: LINK column ID or link dataType columnId for LookUp
            example:
              - sourceRecordId: 1
                destinationRecordId: 1
                linkColumnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
              - sourceRecordId: 1
                destinationRecordId: 2
                linkColumnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
      responses:
        '200':
          description: Records linked successfully
    delete:
      summary: De-Link Records
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nRemoves existing links between records in a source table and records in a destination table. Supports batch de-linking of multiple record pairs in a single request.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nDELETE /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/linkRecordV2\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| workbookId | UUID | ✅ Yes | Workbook identifier |\n\n---\n\n## 4️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n```json\n[\n  {\n    \"sourceRecordId\": integer,\n    \"destinationRecordId\": integer,\n    \"linkColumnId\": \"uuid\"\n  }\n]\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| sourceRecordId | integer | ✅ Yes | Primary key of the record in the current (source) table |\n| destinationRecordId | integer | ✅ Yes | Primary key of the record in the destination table |\n|  linkColumnId | UUID | ✅ Yes | LINK column ID or link dataType columnId |\n\n---\n\n## 8️⃣ Example Request\n\n```bash\ncurl -X DELETE https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/linkRecordV2 \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n-d '[\n  {\n    \"sourceRecordId\": 1,\n    \"destinationRecordId\": 1,\n    \"linkColumnId\": \"21224153-2f85-4b24-a306-4cfbc7e73f70\"\n  },\n  {\n    \"sourceRecordId\": 1,\n    \"destinationRecordId\": 2,\n    \"linkColumnId\": \"21224153-2f85-4b24-a306-4cfbc7e73f70\"\n  }\n]'\n```\n\n---\n\n## ```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: workbookId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workbook identifier
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: array
              items:
                type: object
                required:
                  - sourceRecordId
                  - destinationRecordId
                  - linkColumnId
                properties:
                  sourceRecordId:
                    type: integer
                  destinationRecordId:
                    type: integer
                  linkColumnId:
                    type: string
                    format: uuid
            example:
              - sourceRecordId: 1
                destinationRecordId: 1
                linkColumnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
              - sourceRecordId: 1
                destinationRecordId: 2
                linkColumnId: 21224153-2f85-4b24-a306-4cfbc7e73f70
      responses:
        '200':
          description: Records de-linked successfully
  /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/{linkColumnId}/linkData:
    get:
      summary: Get Link Data
      tags:
        - Links & Joins
      security:
        - bearerAuth: [ ]
      description: "## 1️⃣ Overview\n\n**Purpose:**\nRetrieves the linked records for a specific row via a LINK column. Given a source record's row ID, this returns all destination records that are linked to it through the specified link column.\n\n---\n\n## 2️⃣ Endpoint\n\n```\nGET /noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/{linkColumnId}/linkData?id={rowId}\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Workspace identifier |\n| tableId | UUID | ✅ Yes | Source table identifier |\n| linkColumnId | UUID | ✅ Yes | ID of the LINK column to fetch linked data for |\n\n---\n\n## 4️⃣ Query Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| id | integer | ✅ Yes | The row ID of the source record whose linked records you want to retrieve |\n\n---\n\n## 5️⃣ Authentication\n\nRequires **Bearer JWT Token**\n\n```\nAuthorization: Bearer <token>\n```\n\n---\n\n## 6️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 7️⃣ Example Request\n\n```bash\ncurl -X GET 'https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{tableId}/{linkColumnId}/linkData?id=1' \\\n-H \"Authorization: Bearer <token>\"\n```\n\n---\n\n## 8️⃣ Behavior Summary\n\n```\nReturns all records linked to the specified source row via the given LINK column.\nSupports:\n• Fetching linked records for any LINK column type (HAS_MANY, ONE_TO_ONE, MANY_TO_MANY)\n• id query param — row ID of the source record in the current table\n• linkColumnId — identifies which link column's data to retrieve\n```"
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Workspace identifier
        - name: tableId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: Source table identifier
        - name: linkColumnId
          in: path
          required: true
          schema:
            type: string
            format: uuid
          description: ID of the LINK column to fetch linked data for
        - name: id
          in: query
          required: true
          schema:
            type: integer
          description: The row ID of the source record whose linked records you want to retrieve
      responses:
        '200':
          description: Linked records retrieved successfully
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                      description: Row ID of the linked record in the destination table
                    cellValues:
                      type: object
                      description: Map of column names to their values for the linked record
                      properties:
                        column1:
                          type: number
                          description: User-defined column value
                        column2:
                          type: string
                          description: User-defined column value
                        column3:
                          type: number
                          description: User-defined column value
                        column4:
                          type: integer
                          description: User-defined column value

              example:
                - id: 2
                  cellValues:
                    course_id: 102
                    course_name: JAVA
                    st_id: 3
                    employee_075d: 2
                    employee_753d: 4
  /noCo/api/v2/workspaces/{workspace_id}/folder:
    get:
      summary: Get files in Workspace
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Get files in Workspace
      tags:
        - Knowledge Graph
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nRetrieves all folders\
        \ and files available within a workspace.\n\n---\n\n## 2\uFE0F\u20E3 Endpoint\n\
        \n``` bash\nGET /noCo/api/v2/workspaces/{workspace_id}/folder\n\n ```\n\n\
        ---\n\n## 3\uFE0F\u20E3 Path Parameters\n\n| Parameter | Type | Required |\
        \ Description |\n| --- | --- | --- | --- |\n| workspace_id | UUID | \u2705\
        \ Yes | Workspace identifier |\n\n---\n\n## 4\uFE0F\u20E3 Authentication\n\
        \nRequires authentication using:\n\n``` bash\nAuthorization: Bearer <token>\n\n ```\n\
        \n---\n\n## 5\uFE0F\u20E3 Request Headers\n\n| Header | Required |\n| ---\
        \ | --- |\n| Authorization | \u2705 Yes |\n\n---\n\n## 6\uFE0F\u20E3 Example\
        \ Request\n\n``` bash\ncurl -X GET https://be.datagol.ai/noCo/api/v2/workspaces/{workspace_id}/folder\
        \ \\\n-H \"Authorization: Bearer <token>\"\n\n ```\n\n---\n\n## 7\uFE0F\u20E3 Behavior\
        \ Summary\n\n``` id=\"beh2a\"\nRetrieves all folders and files within the\
        \ specified workspace.\nSupports hierarchical workspace storage structure\
        \ and returns metadata of stored files.\n\n ```"
    post:
      summary: Create Folder
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
