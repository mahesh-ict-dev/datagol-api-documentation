  /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/rows/bulk:
    post:
      summary: Add Rows (Bulk)
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Add Multiple Rows with Data
      tags:
        - WorkBook
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nAdds multiple new rows to
        a workbook within a workspace in a single request.\n\n---\n\n## 2️⃣ Endpoint\n\n```
        bash\nPOST /noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/rows/bulk\n\n
  ```````\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required |
        Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes |
        Workspace identifier |\n| workbookId | UUID | ✅ Yes | Workbook identifier
        |\n\n---\n\n## 4️⃣ Authentication\n\nRequires authentication using:\n\n```
        bash\nAuthorization: Bearer <token>\n\n ```\n\n---\n\n## 5️⃣ Request Headers\n\n|
        Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n\n---\n\n##
        6️⃣ Request Body Schema\n\n``` json\n[\n  {\n    \"cellValues\": {}\n  }\n]\n\n
  ``````\n\n---\n\n## 7️⃣ Field Descriptions\n\n### Bulk Row Data\n\n| Field | Type
        | Required | Description |\n| --- | --- | --- | --- |\n| cellValues | object
        | ✅ Yes | Map of column internal name to value
        |\n\n---\n\n## 8️⃣ Example Request\n\n``` bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/tables/{workbookId}/rows/bulk
        \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\"
        \\\n--data-raw '[{\"cellValues\":{\"first_name\":\"John\",\"years_of_experience\":5,\"is_active\":true,\"start_date\":\"2024-02-18T05:00:00+00:00\"}},{\"cellValues\":{\"first_name\":\"Jane\",\"years_of_experience\":3,\"is_active\":false,\"start_date\":\"2023-06-01T05:00:00+00:00\"}}]'\n\n
  `````\n\n---\n\n## 9️⃣ Behavior Summary\n\n``` id=\"beh1b\"\nInserts multiple
        new records into the workbook in a single request.\nSupports:\n• Top-level array
        of row objects — not wrapped in a parent object  \n• Internal column names must
        be used as keys  \n• Data validation is performed on all rows before insertion
        \ \n• Date values must follow YYYY-MM-DD format  \n• All rows are inserted atomically.\n\n
  ````"
      requestBody:
