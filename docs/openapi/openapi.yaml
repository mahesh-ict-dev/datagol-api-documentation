  /dataSources/api/v1/dataSources:
    post:
      summary: Create Data Source
      security:
        - bearerAuth: [ ]
      tags:
        - Data Sources
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DataSourceRequest'
            examples:
              postgres:
                summary: PostgreSQL
                value:
                  name: sales_pg
                  type: SQL
                  username: readonly_user
                  password: <password>
                  description: Sales OLTP replica
                  properties:
                    dataSourceProvider: postgresql
                    host: db.example.com
                    port: '5432'
                    dbName: sales
                    schema: public
              mysql:
                summary: MySQL
                value:
                  name: crm_mysql
                  type: SQL
                  username: readonly_user
                  password: <password>
                  properties:
                    dataSourceProvider: mysql
                    host: mysql.example.com
                    port: '3306'
                    dbName: crm
                    schemaAutoSyncEnabled: 'true'
      responses:
        '200':
          description: The created data source (credentials masked)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DataSource'
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Connects a database or SaaS application to DataGOL. Once created, its tables can be queried, used as pipeline sources, or used as a pipeline destination.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /dataSources/api/v1/dataSources
        ```

        ---

        ## 3️⃣ Authentication

        ``` bash
        Authorization: Bearer <token>
        ```

        ---

        ## 4️⃣ Required Permissions

        Lakehouse member. You become the owner of the new data source.

        ---

        ## 5️⃣ Field Descriptions

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | name | string | ✅ Yes | Unique data source name (see notes below) |
        | type | enum | ❌ No | Data source category (see notes below) |
        | username | string | ⚠️ Conditional | Database user. Required for database sources. |
        | password | string | ⚠️ Conditional | Database password. Required for database sources. |
        | description | string | ❌ No | Free-text description |
        | properties | object | ✅ Yes | Connection settings. All values are strings. |

        **Notes**

        - **name** — Letters, digits and `_` only. Cannot be changed later. Tables are referenced in SQL as `<name>.<schema>.<table>`.
        - **type** — One of `SQL`, `REST`, `NO_SQL`, `WAREHOUSE`, `SFTP`. Inferred from `properties.dataSourceProvider` when omitted.
        - **password** — Stored encrypted and never returned in responses.

        ### Common `properties` for databases

        | Key | Description |
        | --- | --- |
        | dataSourceProvider | `postgresql`, `mysql`, `sqlserver`, `snowflake`, `redshift`, `bigquery`, `databricks`, `db2`, `sap_hana`, `supabase`, `mongodb`, `mongodb_atlas` |
        | host | Hostname |
        | port | Port, as a string |
        | dbName | Database name |
        | schema | Default schema (PostgreSQL, SQL Server) |
        | additionalProperties | JSON string of extra JDBC options, e.g. `"{\"sslMode\":\"REQUIRED\"}"` |

        ---

        ## 6️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/dataSources/api/v1/dataSources' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "sales_pg",
          "type": "SQL",
          "username": "readonly_user",
          "password": "<password>",
          "properties": {
            "dataSourceProvider": "postgresql",
            "host": "db.example.com",
            "port": "5432",
            "dbName": "sales",
            "schema": "public"
          }
        }'
        ```

        ---

        ## 7️⃣ Behavior Summary

        ```
        1. Validate the name (format, uniqueness)
        2. For SQL sources, test the connection — the request fails if DataGOL cannot connect
        3. Save the data source with the password encrypted
        4. Start a schema sync in the background to discover tables and columns
        Secret values in the response are masked with asterisks.
        ```
