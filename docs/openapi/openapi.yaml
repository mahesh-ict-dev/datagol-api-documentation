                      $ref: '#/components/schemas/Dag'
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Lists the DAGs (orchestration workflows) in your company. Each DAG is returned in full — nodes, edges and its latest run.

        - Admins see every active DAG in the company, newest first.
        - Other users see only the DAGs they have been given access to.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        GET /orchestration/api/v1/dags
        ```

        ---

        ## 3️⃣ Query Parameters

        | Parameter | Type | Required | Description |
        | --- | --- | --- | --- |
        | pipelineId | int64 (repeatable) | ❌ No | Return only DAGs containing these pipelines. A non-admin needs access to each pipeline. |

        ---

        ## 4️⃣ Authentication

        ``` bash
        Authorization: Bearer <token>
        ```

        ---

        ## 5️⃣ Example Request

        ``` bash
        curl -X GET 'https://be.datagol.ai/orchestration/api/v1/dags' \
        -H "Authorization: Bearer <token>"
        ```

        ---

        ## 6️⃣ Behavior Summary

        ```
        Returns { "results": [ Dag, ... ] }.
        Deleted DAGs are never returned.
        For a lightweight, paginated list use POST /orchestration/api/v1/dags/search.
        ```
    post:
      summary: Create DAG
      security:
        - bearerAuth: [ ]
      tags:
        - DAGs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DagRequest'
            examples:
              cron:
                summary: Run every night at 02:00
                value:
                  name: Nightly sales refresh
                  scheduleType: CRON
                  schedule:
                    cronExpression: 0 0 2 * * ?
                  metadata:
                    description: Loads and aggregates sales
                  defaultParameters:
                    region: EMEA
              every6Hours:
                summary: Run every 6 hours
                value:
                  name: Six-hourly sync
                  scheduleType: SCHEDULED
                  schedule:
                    basicSchedule:
                      units: '6'
                      timeUnit: HOURS
              manual:
                summary: Run only on demand
                value:
                  name: Ad-hoc backfill
                  scheduleType: MANUAL
      responses:
        '200':
          description: The created DAG (without nodes, edges or runs)
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Dag'
              example:
                id: 42
                name: Nightly sales refresh
                companyId: 7
                createdAt: 1762675200000
                metadata:
                  description: Loads and aggregates sales
                scheduleType: CRON
                schedule:
                  basicSchedule:
                    timeUnit: HOURS
                  cronExpression: 0 0 2 * * ?
                defaultParameters:
                  region: EMEA
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Creates an empty DAG — a workflow that runs data pipelines in dependency order. Add pipelines to it with **Add DAG Node** and order them with **Add DAG Edge**.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /orchestration/api/v1/dags
        ```

        ---

        ## 3️⃣ Authentication

        ``` bash
        Authorization: Bearer <token>
        ```

        ---

        ## 4️⃣ Request Headers

        | Header | Required |
        | --- | --- |
        | Authorization | ✅ Yes |
        | Content-Type: application/json | ✅ Yes |

        ---

        ## 5️⃣ Field Descriptions

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | name | string | ✅ Yes | Display name of the DAG |
        | scheduleType | enum | ❌ No | `MANUAL` (default), `CRON`, `SCHEDULED` or `DATA_CHANGE` |
        | schedule | object | ⚠️ Conditional | Schedule settings (see below) |
        | metadata | object | ❌ No | Free-form JSON stored with the DAG |
        | defaultParameters | object | ❌ No | Default parameters passed to every run |

        ### Schedule fields

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | cronExpression | string | When `CRON` | Quartz cron, seconds first, e.g. `0 0 2 * * ?` |
        | basicSchedule.units | string | When `SCHEDULED` | Every N hours: `1`, `2`, `3`, `6`, `8`, `12`, `24` |
        | basicSchedule.timeUnit | enum | When `SCHEDULED` | `HOURS` |

        > Omit `schedule` for a manual DAG. Do not send `"schedule": null`.

        ---

        ## 6️⃣ Schedule Types

        | Type | Description |
        | --- | --- |
        | MANUAL | Runs only when triggered with **Create DAG Run** |
        | CRON | Runs on `schedule.cronExpression` |
        | SCHEDULED | Runs every `schedule.basicSchedule.units` hours |
        | DATA_CHANGE | Triggered by changes in the source data |

        ---

        ## 7️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/orchestration/api/v1/dags' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{
          "name": "Nightly sales refresh",
          "scheduleType": "CRON",
          "schedule": { "cronExpression": "0 0 2 * * ?" },
          "defaultParameters": { "region": "EMEA" }
        }'
        ```

        ---

        ## 8️⃣ Behavior Summary

        ```
        Creates the DAG in the caller's company and gives the caller access to it.
        For CRON and SCHEDULED DAGs a scheduler job is registered immediately.
        The response does not include nodes, edges or runs.
        ```
