              type: object
              required:
                - ids
              properties:
                ids:
                  type: array
                  items:
                    type: string
                  description: List of folder or file IDs to delete
                  example:
                    - 'd287afa7-2006-4a91-ae24-03a548d0b58f'
            example:
              ids:
                - 'd287afa7-2006-4a91-ae24-03a548d0b58f'
      responses:
        '200':
          description: Folders or files deleted successfully
      tags:
        - Enterprise Search
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nDeletes one or more folders\
        \ or files from a workspace.\n\nMultiple items can be deleted in a single\
        \ request by passing their IDs in the `ids` array.\n\n---\n\n## 2️⃣ Endpoint\n\
        \n``` bash\nDELETE /noCo/api/v2/workspaces/{workspaceId}/folder\n\n ```\n\
        \n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description\
        \ |\n| --- | --- | --- | --- |\n| workspaceId | string | ✅ Yes | The ID\
        \ of the workspace containing the folders or files to delete |\n\n---\n\n\
        ## 4️⃣ Authentication\n\nRequires authentication using:\n\n``` bash\nAuthorization:\
        \ Bearer <token>\n\n ```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header |\
