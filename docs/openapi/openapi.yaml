  /orchestration/api/v1/dags/{dagId}/runs:
    parameters:
      - name: dagId
        in: path
        required: true
        schema:
          type: integer
          format: int64
        example: 42
    post:
      summary: Create DAG Run
      security:
        - bearerAuth: [ ]
      tags:
        - DAGs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DagRunRequest'
            examples:
              fullRun:
                summary: Run the whole DAG
                value: {}
              withParameters:
                summary: Run with parameters
                value:
                  parameters:
                    region: EMEA
              retryFromNode:
                summary: Retry a failed run from a node
                value:
                  startFromNodeId: 502
                  parentId: 3300
      responses:
        '200':
          description: The new run with one job per node
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DagRun'
              example:
                id: 3301
                dagId: 42
                status: RUNNING
                startTime: 1762675500000
                type: MANUAL
                parameters:
                  region: EMEA
                dagSnapshotId: 88
                jobMappings:
                  - id: 7001
                    dagRunId: 3301
                    dagNodeId: 501
                    jobId: 55501
                    executionOrder: 1
                    status: IN_PROGRESS
                  - id: 7002
                    dagRunId: 3301
                    dagNodeId: 502
                    executionOrder: 2
                    status: PENDING
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Starts a manual run of the DAG. Pipelines execute one after another in topological order; each node gets a job in `jobMappings`.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /orchestration/api/v1/dags/{dagId}/runs
        ```

        ---

        ## 3️⃣ Required Permissions

        Edit access to the DAG.

        ---

        ## 4️⃣ Field Descriptions

        All fields are optional, but a JSON body is required — send `{}` for a plain run.

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | parameters | object | ❌ No | Run parameters passed to the pipelines |
        | startFromNodeId | int64 | ❌ No | Start at this node. Upstream nodes are marked `NOT_EXECUTED`. |
        | parentId | int64 | ❌ No | ID of an earlier run of this DAG that this run retries |

        ---

        ## 5️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/orchestration/api/v1/dags/42/runs' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{}'
        ```

        ---

        ## 6️⃣ Retrying a Failed Run

        If `startFromNodeId` points at the node that failed in the latest run, the new run reuses that run's parameters and graph snapshot and is linked to it through `parentId`.

        ---

        ## 7️⃣ Errors

        | Status | When |
        | --- | --- |
        | 400 | The DAG already has a run in `QUEUED`, `PENDING`, `RUNNING` or `STARTED` |
        | 400 | The DAG has no nodes |
        | 400 | `parentId` is not a run of this DAG |

        ---

        ## 8️⃣ Behavior Summary

        ```
        1. Snapshot the current graph (dagSnapshotId)
        2. Create one job per node, ordered by executionOrder
        3. Start the first pipeline; the next node starts when the previous one finishes
        Poll GET /orchestration/api/v1/dags/{dagId}/runs/{runId} for progress.
        ```
