  /ai/api/v2/enterprise-search/connector/dg-s3-workspace/re-index:
    post:
      summary: Re-index Workspace Files
      parameters:
        - name: workspace_id
          in: query
          required: true
          schema:
            type: string
          description: The ID of the workspace whose files are to be indexed
          example: '{{workspaceId}}'
        - name: full_reindex
          in: query
          required: false
          schema:
            type: boolean
          description: >
            Controls the indexing mode.
            `true` \u2014 performs a full re-index of all documents in the workspace.
            `false` \u2014 performs an incremental index, processing only new or changed documents since the last index run.
          example: true
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
            example: {}
      responses:
        '200':
          description: Re-index Workspace Files
      tags:
        - Enterprise Search
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nTriggers a search index\
        \ job for all files in the specified workspace.\n\nSupports two modes controlled\
        \ by the `full_reindex` flag:\n\n- **Full Re-index** \u2014 indexes all documents\
        \ present in the workspace from scratch.\n- **Incremental Index** \u2014 processes\
        \ only new or changed documents since the last index run.\n\n---\n\n## 2\uFE0F\u20E3\
        \ Endpoint\n\n``` bash\nPOST /ai/api/v2/enterprise-search/connector/dg-s3-workspace/re-index?workspace_id={workspace_id}&full_reindex={true|false}\n\
        \n ```\n\n---\n\n## 3\uFE0F\u20E3 Query Parameters\n\n| Parameter | Type | Required\
        \ | Description |\n| --- | --- | --- | --- |\n| workspace_id | string | \u2705\
        \ Yes | The ID of the workspace whose files are to be indexed |\n| full_reindex\
        \ | boolean | \u274C No | `true` for full re-index of all documents; `false` for\
        \ incremental index of new or changed documents only (default: false) |\n\n\
        ---\n\n## 4\uFE0F\u20E3 Authentication\n\nRequires authentication using:\n\n``` bash\n\
        Authorization: Bearer <token>\n\n ```\n\n---\n\n## 5\uFE0F\u20E3 Request Headers\n\
        \n| Header | Required |\n| --- | --- |\n| Authorization | \u2705 Yes |\n\n---\n\
        \n## 6\uFE0F\u20E3 Example Request\n\n### Full Re-index\n\n``` bash\ncurl --location\
        \ 'https://ai.datagol.ai/ai/api/v2/enterprise-search/connector/dg-s3-workspace/re-index?workspace_id={workspaceId}&full_reindex=true'\
        \ \\\n--header 'Authorization: Bearer <token>' \\\n--data-raw '{}'\n\n ```\n\
        \n### Incremental Index\n\n``` bash\ncurl --location 'https://ai.datagol.ai/ai/api/v2/enterprise-search/connector/dg-s3-workspace/re-index?workspace_id={workspaceId}&full_reindex=false'\
        \ \\\n--header 'Authorization: Bearer <token>' \\\n--data-raw '{}'\n\n ```\n\
        \n---\n\n## 7\uFE0F\u20E3 Behavior Summary\n\n``` id=\"behes1\"\nTriggers a search\
        \ indexing job for the specified workspace.\nfull_reindex=true: Re-indexes\
        \ all documents in the workspace from scratch.\nfull_reindex=false: Performs\
        \ an incremental index, processing only new or changed documents since the\
        \ last run.\n\n ```"
  /ai/api/v2/enterprise-search/connector/dg-s3-workspace/{workspaceId}/status:
    get:
      summary: Get Enterprise Search Index Status
      parameters:
        - name: workspaceId
          in: path
          required: true
          schema:
            type: string
          description: The ID of the workspace to check the index status for
          example: '{{workspaceId}}'
      security:
        - bearerAuth: []
      responses:
        '200':
          description: Get Enterprise Search Index Status
          content:
            application/json:
              schema:
                type: object
                properties:
                  connector_status:
                    type: object
                    description: Overall status of the workspace file connector
                    properties:
                      cc_pair_id:
                        type: integer
                        description: Internal ID of the connector-credential pair
                        example: 125
                      name:
                        type: string
                        description: Name of the connector-credential pair
                        example: 'Datagol-Workspace_File_Connector-{workspaceId}'
                      cc_pair_status:
                        type: string
                        description: Current status of the connector pair (e.g. PAUSED, ACTIVE)
                        example: 'PAUSED'
                      access_type:
                        type: string
                        description: Access type for the connector (e.g. public, private)
                        example: 'public'
                      last_finished_status:
                        type: string
                        description: Result of the last completed indexing run (e.g. success, failure)
                        example: 'success'
                      last_status:
                        type: string
                        description: Status of the most recent indexing attempt
                        example: 'success'
                      last_success:
                        type: string
                        format: date-time
                        description: Timestamp of the last successful indexing run
                        example: '2026-05-29T12:22:50.515871Z'
                      docs_indexed:
                        type: integer
                        description: Total number of documents currently indexed for this workspace
                        example: 2
                      in_progress:
                        type: boolean
                        description: Whether an indexing job is currently running
                        example: true
                      in_repeated_error_state:
                        type: boolean
                        description: Whether the connector is stuck in a repeated error state
                        example: false
                      latest_index_attempt:
                        type: object
                        description: Details of the most recent indexing attempt
                        properties:
                          id:
                            type: integer
                            description: Internal ID of the index attempt
                            example: 396
                          status:
                            type: string
                            description: Result status of the index attempt (e.g. success, failure, in_progress)
                            example: 'success'
                          from_beginning:
                            type: boolean
                            description: Whether this was a full re-index from the beginning
                            example: true
                          new_docs_indexed:
                            type: integer
                            description: Number of new documents indexed in this attempt
                            example: 1
                          total_docs_indexed:
                            type: integer
                            description: Total documents indexed across all attempts
                            example: 2
                          docs_removed_from_index:
                            type: integer
                            description: Number of documents removed from the index in this attempt
                            example: 0
                          error_msg:
                            type: string
                            nullable: true
                            description: Error message if the attempt failed, null otherwise
                            example: null
                          error_count:
                            type: integer
                            description: Number of errors encountered during this attempt
                            example: 0
                          time_started:
                            type: string
                            format: date-time
                            description: Timestamp when the index attempt started
                            example: '2026-05-29T12:22:50.457155+00:00'
                          time_updated:
                            type: string
                            format: date-time
                            description: Timestamp of the last update to this attempt
                            example: '2026-05-29T12:22:57.745602+00:00'
                          poll_range_start:
                            type: string
                            format: date-time
                            description: Start of the time range polled in this attempt
                            example: '1970-01-01T00:00:00Z'
                          poll_range_end:
                            type: string
                            format: date-time
                            description: End of the time range polled in this attempt
                            example: '2026-05-29T12:22:50.515871Z'
                  file_level_indexing_status:
                    type: object
                    description: Per-file indexing status keyed by file ID
                    additionalProperties:
                      type: object
                      properties:
                        id:
                          type: string
                          description: File ID
                          example: 'de4765c5-7705-4544-aba6-6dfbdeb7b35a'
                        status:
                          type: string
                          description: Indexing status of the file (e.g. INDEXED, PENDING, FAILED)
                          example: 'INDEXED'
                        last_modified:
                          type: string
                          format: date-time
                          description: Timestamp when the file was last modified
                          example: '2026-05-29T11:40:34Z'
                        last_synced:
                          type: string
                          format: date-time
                          nullable: true
                          description: Timestamp when the file was last synced, null if never synced
                          example: null
                        has_been_indexed:
                          type: boolean
                          description: Whether the file has been successfully indexed at least once
                          example: true

      tags:
        - Enterprise Search
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nRetrieves the current indexing\
        \ status of the enterprise search connector for a specific workspace.\n\nUse\
        \ this endpoint to monitor whether indexing is in progress, completed, or\
        \ failed.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nGET /ai/api/v2/enterprise-search/connector/dg-s3-workspace/{workspaceId}/status\n\
        \n ```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required\
        \ | Description |\n| --- | --- | --- | --- |\n| workspaceId | string | ✅\
        \ Yes | The ID of the workspace to check the index status for |\n\n---\n\n\
        ## 4️⃣ Authentication\n\nRequires authentication using:\n\n``` bash\nAuthorization:\
