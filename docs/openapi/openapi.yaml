    get:
      summary: Get DAG Run
      security:
        - bearerAuth: [ ]
      tags:
        - DAGs
      responses:
        '200':
          description: The run with its per-node jobs
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DagRun'
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Retrieves one run with the status of every node and the underlying pipeline job. Use this to poll a run started with **Create DAG Run**.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        GET /orchestration/api/v1/dags/{dagId}/runs/{runId}
        ```

        ---

        ## 3️⃣ Example Request

        ``` bash
        curl -X GET 'https://be.datagol.ai/orchestration/api/v1/dags/42/runs/3301' \
        -H "Authorization: Bearer <token>"
        ```

        ---

        ## 4️⃣ Run Status Values

        | Run `status` | Meaning |
        | --- | --- |
        | PENDING / QUEUED / STARTED / RUNNING | In progress |
        | COMPLETED / SUCCEEDED | All nodes finished |
        | FAILED | A node failed; later nodes did not run |
        | CANCELLED | Cancelled with **Cancel DAG Run** |

        | Node `jobMappings[].status` | Meaning |
        | --- | --- |
        | NOT_EXECUTED | Skipped (upstream of `startFromNodeId`) |
        | PENDING | Waiting for upstream nodes |
        | IN_PROGRESS | Pipeline job running (`jobId` is set) |
        | COMPLETED / FAILED / CANCELLED | Finished |
    put:
      summary: Cancel DAG Run
      security:
        - bearerAuth: [ ]
      tags:
        - DAGs
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - status
              properties:
                status:
                  type: string
                  enum:
                    - CANCELLED
            example:
              status: CANCELLED
      responses:
        '200':
          description: The run after the update
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DagRun'
      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Cancels a run that is still in progress. The currently running pipeline job is cancelled and the remaining nodes do not run.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        PUT /orchestration/api/v1/dags/{dagId}/runs/{runId}
        ```

        ---

        ## 3️⃣ Request Body

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | status | enum | ✅ Yes | `CANCELLED` — the only supported change |

        ---

        ## 4️⃣ Example Request

        ``` bash
        curl -X PUT 'https://be.datagol.ai/orchestration/api/v1/dags/42/runs/3301' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{ "status": "CANCELLED" }'
        ```

        ---

        ## 5️⃣ Behavior Summary

        ```
        Only runs in QUEUED, PENDING, RUNNING or STARTED can be cancelled; otherwise the run is returned unchanged.
        A pipeline that is still initializing cannot be cancelled yet — retry after a few seconds.
        ```
