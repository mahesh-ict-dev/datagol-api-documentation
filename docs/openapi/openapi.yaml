openapi: 3.0.0
info:
  title: DataGOL APIs
  version: 1.0.0
  description: ''
servers:
  - url: https://be.datagol.ai
  - url: https://be.datagol.ai
  - url: https://kg.datagol.ai
  - url: https://ai.datagol.ai
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        This API uses OAuth 2.0 with the authorization code grant flow.
  schemas:
    PageInfo:
      type: object
      properties:
        pageNumber:
          type: integer
          format: int64
        pageSize:
          type: integer
          format: int64
        totalNumberOfRecords:
          type: integer
          format: int64
        totalNumberOfPages:
          type: integer
          format: int64
    UserSummary:
      type: object
      description: The user who created or changed the resource
      properties:
        id:
          type: integer
          format: int64
        firstname:
          type: string
        lastname:
          type: string
        email:
          type: string
    Schedule:
      type: object
      properties:
        cronExpression:
          type: string
          description: Quartz cron expression, seconds first. Used when `scheduleType` is `CRON`.
          example: 0 0 2 * * ?
        basicSchedule:
          type: object
          description: Used when `scheduleType` is `SCHEDULED`
          properties:
            units:
              type: string
              description: Run every N hours
              enum: ['1', '2', '3', '6', '8', '12', '24']
            timeUnit:
              type: string
              enum:
                - HOURS
    ScheduleType:
      type: string
      enum:
        - MANUAL
        - CRON
        - SCHEDULED
        - DATA_CHANGE
    JobStatus:
      type: string
      enum:
        - QUEUED
        - PENDING
        - STARTED
        - RUNNING
        - COMPLETED
        - SUCCEEDED
        - FAILED
        - CANCELLED
        - INCOMPLETE
        - PRE_VALIDATION_FAILED
        - POST_VALIDATION_FAILED
        - DELETED
        - UNKNOWN

    # ---------- Data Sources ----------
    DataSourceRequest:
      type: object
      required:
        - name
        - properties
      properties:
        name:
          type: string
          pattern: '^[a-zA-Z0-9_]+$'
          description: Unique name. Cannot be changed after creation.
        type:
          type: string
          enum:
            - SQL
            - REST
            - NO_SQL
            - WAREHOUSE
            - SFTP
        username:
          type: string
        password:
          type: string
          format: password
          writeOnly: true
          description: Stored encrypted; never returned. Omit on update to keep the current password.
        description:
          type: string
        properties:
          type: object
          description: Connection settings. All values are strings.
          additionalProperties:
            type: string
    DataSource:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
          description: Always returned in lower case
        type:
          type: string
          enum:
            - SQL
            - REST
            - NO_SQL
            - WAREHOUSE
            - SFTP
        subType:
          type: string
          enum:
            - FILE
            - FOLDER
        description:
          type: string
        username:
          type: string
        properties:
          type: object
          description: Connection settings. Secret values are masked with asterisks.
          additionalProperties:
            type: string
        format:
          type: string
          enum:
            - PARQUET
            - ICEBERG
            - CSV
        storageType:
          type: string
          enum:
            - AWS
            - AZURE
            - GCS
        warehouse:
          type: boolean
          description: True for DataGOL-managed warehouse sources
        caseSensitive:
          type: boolean
        companyId:
          type: integer
          format: int64
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds
        lastSyncedAt:
          type: integer
          format: int64
          description: Epoch milliseconds of the last successful schema sync
        tables:
          type: array
          description: Present when `includeTables=true`
          items:
            $ref: '#/components/schemas/DataSourceTable'
      example:
        id: 4521
        name: sales_pg
        type: SQL
        description: Sales OLTP replica
        username: readonly_user
        properties:
          dataSourceProvider: postgresql
          host: db.example.com
          port: '5432'
          dbName: sales
          schema: public
        warehouse: false
        caseSensitive: false
        companyId: 7
        createdAt: 1762675200000
        lastSyncedAt: 1762675260000
    DataSourceTable:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        alias:
          type: string
        namespace:
          type: string
          description: Schema the table lives in
        qualifiedName:
          type: string
          description: Fully qualified name to use in SQL, e.g. `sales_pg.public.orders`
        description:
          type: string
        type:
          type: string
          enum:
            - TABLE
            - VIEW
        dataSourceId:
          type: integer
          format: int64
        dataSourceName:
          type: string
        columns:
          type: array
          items:
            $ref: '#/components/schemas/DataSourceColumn'
        files:
          type: array
          description: Uploaded files (file-based sources only)
          items:
            $ref: '#/components/schemas/DataSourceFile'
        createDate:
          type: integer
          format: int64
        modiDate:
          type: integer
          format: int64
      example:
        id: 7001
        name: orders
        namespace: public
        qualifiedName: sales_pg.public.orders
        type: TABLE
        dataSourceId: 4521
        dataSourceName: sales_pg
        columns:
          - id: 90001
            name: amount
            dataType: numeric
            qualifiedName: sales_pg.public.orders.amount
            isUniqueCol: false
    DataSourceColumn:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        dataType:
          type: string
        sourceDataType:
          type: string
          description: Type as reported by the source database
        qualifiedName:
          type: string
        description:
          type: string
        tableId:
          type: integer
          format: int64
        datasourceId:
          type: integer
          format: int64
        isUniqueCol:
          type: boolean
        isPartitionCol:
          type: boolean
    DataSourceFile:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
        byteSize:
          type: integer
          format: int64
        tableId:
          type: integer
          format: int64
        datasourceId:
          type: integer
          format: int64
        createDate:
          type: integer
          format: int64
    DescriptionNode:
      type: object
      description: A node in the description tree — data source, table or column — with its children
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        type:
          type: string
          description: Column data type (columns only)
        description:
          type: string
        children:
          type: array
          items:
            type: object
            description: Nested DescriptionNode — tables under the data source, columns under a table
    RequestStatusLog:
      type: object
      properties:
        id:
          type: string
          description: Request ID — poll it with `GET /noCo/api/v1/requestLog/status/{requestId}`
        status:
          type: string
          enum:
            - INITIATED
            - IN_PROGRESS
            - SCHEMA_COMPLETE
            - DONE
            - PARTIAL
            - FAILED
            - CANCELLED
        eventId:
          type: string
        eventName:
          type: string
        message:
          type: string
        companyId:
          type: integer
          format: int64
    SchemaSyncCronEnvelope:
      type: object
      properties:
        success:
          type: boolean
        version:
          type: string
        date:
          type: integer
          format: int64
        data:
          type: object
          properties:
            dataSourceId:
              type: integer
              format: int64
            cronExpression:
              type: string
            nextFireTime:
              type: integer
              format: int64
              description: Epoch milliseconds
            previousFireTime:
              type: integer
              format: int64
              description: Epoch milliseconds
    SchemaChange:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dataSourceId:
          type: integer
          format: int64
        fromSchemaId:
          type: integer
          format: int64
        toSchemaId:
          type: integer
          format: int64
        changes:
          type: array
          items:
            type: object
            properties:
              type:
                type: string
                enum:
                  - TABLE_CREATED
                  - TABLE_DELETED
                  - TABLE_MODIFIED
                  - VIEW_CREATED
                  - VIEW_DELETED
                  - VIEW_MODIFIED
                  - COLUMN_CREATED
                  - COLUMN_DELETED
                  - COLUMN_MODIFIED
                  - FOREIGN_KEY_CREATED
                  - FOREIGN_KEY_DELETED
                  - FOREIGN_KEY_MODIFIED
              tables:
                type: array
                items:
                  type: object
              columns:
                type: array
                items:
                  type: object
              modifications:
                type: array
                description: Previous and current values of each modified object
                items:
                  type: object
        verified:
          type: boolean
        verifiedBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64

    # ---------- Data Pipelines ----------
    DataPipelineStream:
      type: object
      properties:
        id:
          type: integer
          format: int64
          description: Keep on update so the stream is updated rather than replaced
        name:
          type: string
        outputTableName:
          type: string
          pattern: '^[a-zA-Z0-9_]{1,128}$'
        query:
          type: string
          description: SQL SELECT. Reference tables as `<dataSourceName>.<schema>.<table>`.
        syncMode:
          type: string
          default: FULL_REFRESH
          enum:
            - FULL_REFRESH
            - INCREMENTAL_APPEND
            - INCREMENTAL_APPEND_V2
            - INCREMENTAL_APPEND_MERGE
            - INCREMENTAL_APPEND_V2_MERGE
        uniqueColumns:
          type: array
          items:
            type: string
        cursor:
          type: object
          properties:
            cursorName:
              type: string
            cursorDataType:
              type: string
            cursorLastValue:
              type: string
              readOnly: true
        status:
          type: string
          enum:
            - ACTIVE
            - PAUSED
        executionType:
          type: string
          default: SQL
          enum:
            - SQL
            - PYTHON
        script:
          type: string
        scriptParams:
          type: object
          additionalProperties: true
        scriptTimeoutSeconds:
          type: integer
        requiredParams:
          type: array
          readOnly: true
          description: Placeholders found in the query
          items:
            type: string
    DataPipelineRequest:
      type: object
      required:
        - name
        - type
        - streams
      properties:
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - CUSTOM
            - STANDARD
            - DEDUP
        queryEngine:
          type: string
          enum:
            - SPARK
            - ATHENA
            - SNOWFLAKE
            - BIGQUERY
            - CLOUD_BIGQUERY
            - MYSQL
            - SQL_SERVER
            - REDSHIFT
            - JDBC
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        destination:
          type: object
          description: Data source the output is written to
          properties:
            id:
              type: integer
              format: int64
        sources:
          type: array
          description: Source data sources (only for `STANDARD` and `DEDUP`; derived from the query otherwise)
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
        streams:
          type: array
          items:
            $ref: '#/components/schemas/DataPipelineStream'
        parameters:
          type: object
          additionalProperties: true
        syncNow:
          type: boolean
          default: false
    DataPipeline:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        description:
          type: string
        type:
          type: string
          enum:
            - CUSTOM
            - STANDARD
            - DEDUP
        queryEngine:
          type: string
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        sources:
          type: array
          items:
            $ref: '#/components/schemas/DataSource'
        destination:
          $ref: '#/components/schemas/DataSource'
        streams:
          type: array
          items:
            $ref: '#/components/schemas/DataPipelineStream'
        streamCount:
          type: integer
        parameters:
          type: object
          additionalProperties: true
        companyId:
          type: integer
          format: int64
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        createdAt:
          type: integer
          format: int64
        modifiedAt:
          type: integer
          format: int64
        nextFireTimes:
          type: array
          description: Upcoming scheduled runs, epoch milliseconds
          items:
            type: integer
            format: int64
        jobs:
          type: array
          description: Recent runs
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              status:
                $ref: '#/components/schemas/JobStatus'
              startTime:
                type: integer
                format: int64
              endTime:
                type: integer
                format: int64
              failureReason:
                type: string
      example:
        id: 1001
        name: daily_orders_rollup
        description: Aggregates orders per customer
        type: CUSTOM
        queryEngine: SPARK
        scheduleType: CRON
        schedule:
          cronExpression: 0 0 */6 ? * *
        destination:
          id: 4521
          name: analytics_wh
        streams:
          - id: 8801
            name: orders_by_customer
            outputTableName: orders_by_customer
            query: SELECT customer_id, COUNT(*) AS order_count FROM sales_pg.public.orders GROUP BY customer_id
            syncMode: FULL_REFRESH
            executionType: SQL
            status: ACTIVE
        streamCount: 1
        companyId: 7
        createdAt: 1762675200000
        nextFireTimes:
          - 1762689600000
        jobs:
          - id: 55501
            status: COMPLETED
            startTime: 1762675500000
            endTime: 1762675620000
    PipelineJob:
      type: object
      properties:
        id:
          type: integer
          format: int64
        jobGroupId:
          type: string
        status:
          $ref: '#/components/schemas/JobStatus'
        startTime:
          type: integer
          format: int64
          description: Epoch milliseconds
        endTime:
          type: integer
          format: int64
          description: Epoch milliseconds
        startedBy:
          $ref: '#/components/schemas/UserSummary'
        cancelledBy:
          $ref: '#/components/schemas/UserSummary'
        totalStats:
          type: string
          description: Run statistics as a JSON string
        streams:
          type: array
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              name:
                type: string
              pipelineId:
                type: integer
                format: int64
              jobId:
                type: integer
                format: int64
              status:
                $ref: '#/components/schemas/JobStatus'
              totalStats:
                type: string

    # ---------- DAGs ----------
    DagRequest:
      type: object
      required:
        - name
      properties:
        name:
          type: string
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        metadata:
          type: object
          additionalProperties: true
        defaultParameters:
          type: object
          description: Default parameters passed to every run
          additionalProperties: true
    Dag:
      type: object
      properties:
        id:
          type: integer
          format: int64
        name:
          type: string
        companyId:
          type: integer
          format: int64
        createdAt:
          type: integer
          format: int64
          description: Epoch milliseconds
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        scheduleType:
          $ref: '#/components/schemas/ScheduleType'
        schedule:
          $ref: '#/components/schemas/Schedule'
        metadata:
          type: object
          additionalProperties: true
        defaultParameters:
          type: object
          additionalProperties: true
        nodes:
          type: array
          items:
            $ref: '#/components/schemas/DagNode'
        edges:
          type: array
          items:
            $ref: '#/components/schemas/DagEdge'
        latestRun:
          $ref: '#/components/schemas/DagRun'
    DagNodeRequest:
      type: object
      required:
        - pipelineId
      properties:
        id:
          type: integer
          format: int64
          description: Node ID — required only for the bulk update
        pipelineId:
          type: integer
          format: int64
          description: Data pipeline this node runs
        metadata:
          type: object
          description: Free-form JSON, e.g. canvas position
          additionalProperties: true
    DagNode:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dagId:
          type: integer
          format: int64
        pipelineId:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
        updatedAt:
          type: integer
          format: int64
    DagEdgeRequest:
      type: object
      required:
        - fromNodeId
        - toNodeId
      properties:
        fromNodeId:
          type: integer
          format: int64
          description: Upstream node ID
        toNodeId:
          type: integer
          format: int64
          description: Downstream node ID
        metadata:
          type: object
          additionalProperties: true
    DagEdge:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dagId:
          type: integer
          format: int64
        fromNodeId:
          type: integer
          format: int64
        toNodeId:
          type: integer
          format: int64
        metadata:
          type: object
          additionalProperties: true
        createdAt:
          type: integer
          format: int64
    DagRunRequest:
      type: object
      properties:
        parameters:
          type: object
          additionalProperties: true
        startFromNodeId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
    DagRun:
      type: object
      properties:
        id:
          type: integer
          format: int64
        dagId:
          type: integer
          format: int64
        status:
          $ref: '#/components/schemas/JobStatus'
        type:
          $ref: '#/components/schemas/ScheduleType'
        startTime:
          type: integer
          format: int64
        endTime:
          type: integer
          format: int64
        createdBy:
          $ref: '#/components/schemas/UserSummary'
        parameters:
          type: object
          additionalProperties: true
        dagSnapshotId:
          type: integer
          format: int64
          description: Graph snapshot this run executed — see **Get DAG Snapshot**
        startFromNodeId:
          type: integer
          format: int64
        parentId:
          type: integer
          format: int64
          description: The run this run retries
        jobMappings:
          type: array
          description: One entry per node, in execution order
          items:
            type: object
            properties:
              id:
                type: integer
                format: int64
              dagRunId:
                type: integer
                format: int64
              dagNodeId:
                type: integer
                format: int64
              jobId:
                type: integer
                format: int64
                description: Pipeline job ID, set once the node starts
              executionOrder:
                type: integer
              status:
                type: string
                enum:
                  - NOT_EXECUTED
                  - PENDING
                  - IN_PROGRESS
                  - COMPLETED
                  - FAILED
                  - CANCELLED
              job:
                $ref: '#/components/schemas/PipelineJob'
tags:
  - name: Links & Joins
    description: |
      ## 🔗 Links & Joins

      LINK and LOOKUP are special workbook column types that enable relational data modeling across tables.

      | Column Type | Purpose |
      |---|---|
      | `LINK` | Defines a relationship between two tables |
      | `LOOKUP` | Projects columns from an associated table via a link |

      Both are configured through `ColumnDTO.colOptions`. A table can have multiple link columns, and each link can have multiple lookup columns.

      ---

      ## 📐 UI Data Types

      - **LINK** — Special column used to represent inter-table relations
      - **LOOKUP** — Special column used to project associated table fields via a link

      ---

      ## 🔗 LINK Semantics

      A LINK column stores metadata for:
      - `tableId` — Current table
      - `associatedTableId` — Associated (linked) table
      - `relationType` — Type of relationship
      - `linkColumnId` — Link column identifier

      **Supported relation patterns:**

      | Pattern | Description |
      |---|---|
      | `ONE_TO_ONE` | Each record in the source maps to one record in the destination |
      | `ONE_TO_MANY` | One source record maps to many destination records |
      | `MANY_TO_MANY` | Many source records map to many destination records |

      ---

      ## 🔍 LOOKUP Semantics

      - A LOOKUP column is tightly coupled with a specific LINK column
      - References a link using `linkColumnId`
      - Represents a selected column from the associated table
      - Multiple lookup columns can be defined for the same link

      ---

      ## 🗂️ Metadata in `ColumnDTO.colOptions`

      Use `colOptions` to persist link/lookup metadata.

      | Field | Description |
      |---|---|
      | `columnId` | Current column ID |
      | `tableId` | Current table ID |
      | `associatedTableId` | Associated table ID |
      | `linkColumnId` | Link column ID — used by LOOKUP; references the LINK column's `columnId` |
      | `relationType` | Relation semantics for LINK |

      ---

      ## 🔄 Manual Linking Record Flow

      To create manual record-level links:

      1. Fetch associated table schema/data
      2. User selects associated record(s) to link
      3. Send linking payload with:
          - `sourceRecordId` — PK of the current table row
          - `destinationRecordId` — PK of the associated table row
          - `linkColumnId` — LINK column identifier
      4. Backend resolves link metadata from `linkColumnId` (relation type, associated table, direction/constraints)
      5. Backend applies relation rules and stores the link relation

      ---

      ## 📋 Record Linking Contract

      | Field | Description |
      |---|---|
      | `sourceRecordId` | PK of the current table row |
      | `destinationRecordId` | PK of the associated table row |
      | `linkColumnId` | LINK column identifier |
      | `tableId` | Current table ID |

      > Backend derives all remaining relation metadata from the link configuration.

      ---

      ## ⚠️ Important Notes

      > - LINK and LOOKUP are **column-level constructs** first; record linking is a data-level operation built on top
      > - LOOKUP behavior depends on LINK existence and metadata integrity
      > - With multiple links to the same associated table, each LOOKUP must bind to the correct `linkColumnId`
      > - Always treat the associated row ID as the associated table PK for linking UI selection

  - name: Data Sources
    description: |
      ## 🔌 Data Sources

      A data source is a connection to an external database (PostgreSQL, MySQL, Snowflake, BigQuery, ...), a SaaS application, or a DataGOL-managed warehouse. Once connected, DataGOL syncs its schema — tables and columns — so you can query it, describe it for AI, and use it in data pipelines.

      | Step | Endpoint |
      |---|---|
      | 1. Connect | `POST /dataSources/api/v1/dataSources` |
      | 2. Wait for the schema sync | `GET /dataSources/api/v1/{dataSourceId}/getSyncSchemaStatus` |
      | 3. Browse tables | `GET /dataSources/api/v1/dataSources/{dataSourceId}/tables` |
      | 4. Re-sync after source changes | `GET /dataSources/api/v1/dataSources/{dataSourceId}/syncSchema` |

      > In SQL, reference a table as `<dataSourceName>.<schema>.<table>` — the table's `qualifiedName`.

      Secrets are never returned: `password` is write-only and secret `properties` come back masked.
  - name: Data Pipelines
    description: |
      ## 🚰 Data Pipelines

      A data pipeline reads from one or more data sources, transforms the data with SQL (or Python), and writes each **stream** to an output table in a destination data source.

      | Step | Endpoint |
      |---|---|
      | 1. Create | `POST /dataPipeline/api/v2` |
      | 2. Run | `POST /dataPipeline/api/v1/{pipelineId}/run` |
      | 3. Poll the job | `GET /dataPipeline/api/v2/{pipelineId}/job/{jobId}` |
      | 4. On failure, read the error | `GET /dataPipeline/api/v1/{pipelineId}/job/{jobId}/errorLog` |

      Pipelines can also run on a schedule (`CRON` / `SCHEDULED`) or as nodes in a DAG.

      > Pipelines are created, read and updated under `/dataPipeline/api/v2`; run, cancel and delete are under `/dataPipeline/api/v1`.
  - name: DAGs
    description: |
      ## 🔀 DAGs (Orchestration)

      A DAG runs several data pipelines in dependency order. Each **node** is a pipeline; each **edge** says the downstream node waits for the upstream one. Cycles are rejected.

      | Step | Endpoint |
      |---|---|
      | 1. Create the DAG | `POST /orchestration/api/v1/dags` |
      | 2. Add pipelines as nodes | `POST /orchestration/api/v1/dags/{dagId}/nodes` |
      | 3. Connect nodes | `POST /orchestration/api/v1/dags/{dagId}/edges` |
      | 4. Run it | `POST /orchestration/api/v1/dags/{dagId}/runs` |
      | 5. Track the run | `GET /orchestration/api/v1/dags/{dagId}/runs/{runId}` |

      A run executes one node at a time in topological order. If a node fails, retry from it with `startFromNodeId`.
paths:
  /idp/api/v1/user/token:
    post:
      summary: Generate Authentication Token
      responses:
        '200':
          description: Authentication token generated successfully
      tags:
        - Getting Started
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nGenerates an authentication token\
        \ for a user in the DataGOL Platform.\n\nThis endpoint validates the provided\
        \ user credentials and returns a JWT token that can be used to authenticate\
        \ subsequent API requests.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nPOST /idp/api/v1/user/token\n\
        \n ```\n\nBase URL:\n\n```\nhttps://be.datagol.ai\n\n ```\n\n---\n\n## 3️⃣ Request Headers\n\n\
        | Header | Required |\n| --- | --- |\n| Content-Type: application/json | ✅ Yes |\n\
        \n---\n\n## 4️⃣ Request Body Schema\n\n``` json\n{\n  \"email\": \"string\",\n\
        \  \"password\": \"string\"\n}\n\n ```\n\n---\n\n## 5️⃣ Field Descriptions\n\n\
        ### Token Generation Fields\n\n| Field | Type | Description |\n| --- | --- | --- |\n\
        | email | string | The registered email address (e.g., sample_email@datagol.com). |\n\
        | password | string | The user's account password. |\n\n---\n\n## 6️⃣ Example Request\n\n\
        ``` bash\ncurl -X POST https://be.datagol.ai/idp/api/v1/user/token \\\n-H \"\
        Content-Type: application/json\" \\\n-d '{\n  \"email\": \"sample_email@datagol.com\"\
        ,\n  \"password\": \"Password123\"\n}'\n\n ```\n\n---\n\n## 7️⃣ Example Response\n\n\
        ``` json\n{\n  \"token\": \"eyXXXXXX\"\n\
        }\n\n ```\n\n---\n\n## 8️⃣ Behavior Summary\n\nValidates the provided user credentials\
        \ and generates a JWT authentication token.\n\nThe returned token should be\
        \ used in subsequent API requests for authentication, typically passed in request\
        \ headers."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: sample_email@datagol.com
              password: password123
  /idp/api/v1/user/login:
    post:
      summary: Login to DataGOL
      responses:
        '200':
          description: Login to DataGOL
      tags:
        - Getting Started
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nAuthenticates a user\
        \ into the DataGOL Platform.\n\nOn success, it returns the user's profile,\
        \ including their administrative roles and assigned permissions within the\
        \ workspace.\n\n---\n\n## 2\uFE0F\u20E3 Endpoint\n\n``` bash\nPOST /idp/api/v1/user/login\n\
        \n ```\n\nBase URL:\n\n```\nhttps://be.datagol.ai\n\n ```\n\n---\n\n## 3\uFE0F\
        \u20E3 Request Headers\n\n| Header | Required |\n| --- | --- |\n| Content-Type:\
        \ application/json | \u2705 Yes |\n\n---\n\n## 4\uFE0F\u20E3 Request Body\
        \ Schema\n\n``` json\n{\n  \"email\": \"string\",\n  \"password\": \"string\"\
        \n}\n\n ```\n\n---\n\n## 5\uFE0F\u20E3 Field Descriptions\n\n### Login Fields\n\
        \n| Field | Type | Description |\n| --- | --- | --- |\n| email | string |\
        \ The registered email address (e.g., [sample_email@datagol.com](https://mailto:sample_email@datagol.com)).\
        \ |\n| password | string | The user's account password. |\n\n---\n\n## 6\uFE0F\
        \u20E3 Example Request\n\n``` bash\ncurl -X POST https://be.datagol.ai/idp/api/v1/user/login\
        \ \\\n-H \"Content-Type: application/json\" \\\n-d '{\n  \"email\": \"sample_email@datagol.com\"\
        ,\n  \"password\": \"Password123\"\n}'\n\n ```\n\n---\n\n## 7\uFE0F\u20E3\
        \ Behavior Summary\n\nAuthenticates a user into the DataGOL Platform and returns\
        \ the user profile with administrative roles and workspace permissions."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
            example:
              email: sample_email@datagol.com
              password: password123
  /idp/api/v1/company/serviceAccount:
    post:
      summary: Create Service Account
      responses:
        '200':
          description: Create Service Account
      tags:
        - Getting Started
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nCreates a new service\
        \ account within a specific company.\n\nA unique system-generated email (e.g.,\
        \ `@datagol.iam.serviceaccount.com`) is assigned to the account upon creation.\n\
        \n---\n\n## 2\uFE0F\u20E3 Endpoint\n\n``` bash\nPOST /idp/api/v1/company/serviceAccount\n\
        \n ```\n\nBase URL:\n\n```\nhttps://be.datagol.ai\n\n ```\n\n---\n\n## 3\uFE0F\
        \u20E3 Authentication\n\nRequires Bearer Token  \nUser must have `ACCOUNT_ADMIN`\
        \ or similar administrative privileges.\n\n---\n\n## 4\uFE0F\u20E3 Request\
        \ Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization: Bearer\
        \ | \u2705 Yes |\n| Content-Type: application/json | \u2705 Yes |\n\n---\n\
        \n## 5\uFE0F\u20E3 Request Body Schema\n\n``` json\n{\n  \"name\": \"string\"\
        ,\n  \"description\": \"string\"\n}\n\n ```\n\n---\n\n## 6\uFE0F\u20E3 Field\
        \ Descriptions\n\n### Service Account Fields\n\n| Field | Type | Required\
        \ | Description |\n| --- | --- | --- | --- |\n| name | string | \u2705 Yes\
        \ | Unique account name. No spaces or special characters.\
        \ |\n| description | string | \u274C No | Purpose of the account. May be\
        \ empty. |\n\
        \n---\n\n## 7\uFE0F\u20E3 Example Request\n\n``` bash\ncurl -X POST https://be.datagol.ai/idp/api/v1/company/serviceAccount\
        \ \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\"\
        \ \\\n-d '{\n  \"name\": \"ci_cd_service_account\",\n  \"description\": \"\
        Service account for CI/CD integrations\"\n}'\n\n ```\n\n---\n\n## 8\uFE0F\u20E3\
        \ Behavior Summary\n\nCreates a new service account within the company and\
        \ assigns a unique system-generated email address to it."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                name:
                  type: string
                description:
                  type: string
            example:
              name: sample_service_token
              description: ''
  /idp/api/v1/company/serviceAccount/{serviceTokenId}/token/reset:
    get:
      summary: Get Service Token
      parameters:
        - name: neverExpires
          in: query
          schema:
            type: boolean
          example: 'true'
      responses:
        '200':
          description: get service token
      tags:
        - Getting Started
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nResets and regenerates\
        \ the access token for an existing service account.\n\nThe newly generated\
        \ token can optionally be configured to never expire.\n\n---\n\n## 2\uFE0F\
        \u20E3 Endpoint\n\n``` bash\nPOST /idp/api/v1/company/serviceAccount/{serviceAccountId}/token/reset?neverExpires=true\n\
        \n ```\n\n---\n\n## 3\uFE0F\u20E3 Path Parameters\n\n| Parameter | Type |\
        \ Required | Description |\n| --- | --- | --- | --- |\n| serviceAccountId\
        \ | UUID | \u2705 Yes | Identifier of the service account whose token will\
        \ be reset |\n\n---\n\n## 4\uFE0F\u20E3 Authentication\n\nRequires Bearer\
        \ Token  \nUser must have `ACCOUNT_ADMIN` or similar administrative privileges.\n\
        \n---\n\n## 5\uFE0F\u20E3 Request Headers\n\n| Header | Required |\n| ---\
        \ | --- |\n| Authorization: Bearer | \u2705 Yes |\n\n---\n\n## 6\uFE0F\u20E3\
        \ Example Request\n\n``` bash\ncurl -X POST \"https://be.datagol.ai/idp/api/v1/company/serviceAccount/{serviceAccountId}/token/reset?neverExpires=true\"\
        \ \\\n-H \"Authorization: Bearer <token>\"\n\n ```\n\n---\n\n## 7\uFE0F\u20E3\
        \ Behavior Summary\n\nResets the existing service account token and generates\
        \ a new one.  \nIf `neverExpires=true` is provided, the newly generated token\
        \ will not expire."
    parameters:
      - name: serviceTokenId
        in: path
        required: true
        schema:
          type: string
        example: '{{serviceTokenId}}'
  /noCo/api/v2/workspaces:
    post:
      summary: Create Workspace
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: create Workspace
      tags:
        - Workspaces
      description: "## 1\uFE0F\u20E3 Overview\n\n**Purpose:**  \nCreates a new workspace\
        \ in the DataGOL Platform.\n\nWorkspaces help organize users, resources, and\
        \ configurations within the platform.\n\n---\n\n## 2\uFE0F\u20E3 Endpoint\n\
        \n``` bash\nPOST /noCo/api/v2/workspaces\n\n ```\n\n---\n\n## 3\uFE0F\u20E3\
        \ Authentication\n\nRequires authentication using:\n\n``` id=\"l8v3z7\"\n\
        Authorization: Bearer <token>\n\n ```\n\n---\n\n## 4\uFE0F\u20E3 Request Headers\n\
        \n| Header | Required |\n| --- | --- |\n| Authorization | \u2705 Yes |\n| Content-Type:\
        \ application/json | \u2705 Yes |\n\n---\n\n## 5\uFE0F\u20E3 Request Body\
        \ Schema\n\n``` json\n{\n  \"name\": \"string\",\n  \"description\": \"string\"\
        \n}\n\n ```\n\n---\n\n## 6\uFE0F\u20E3 Field Descriptions\n\n### Workspace\
        \ Fields\n\n| Field | Type | Required | Description |\n| --- | --- | --- |\
        \ --- |\n| name | string | \u2705 Yes | The display name of the workspace\
        \ |\n| description | string | \u274C No | A brief description of the workspace\
        \ (can be an empty string) |\n\n---\n\n## 7\uFE0F\u20E3 Example Request\n\n\
        ``` bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces \\\n-H\
        \ \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n\
        -d '{\n  \"name\": \"Sales Workspace\",\n  \"description\": \"Workspace for\
        \ sales team data\"\n}'\n\n ```\n\n---\n\n## 8\uFE0F\u20E3 Behavior Summary\n\
        \nCreates a new workspace in the DataGOL Platform to organize users, resources,\
        \ and configurations."
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
            example:
              name: sample demo workspace
              description: ''
    get:
      summary: Get All Workspaces
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Get All Workspaces
      tags:
        - Workspaces
      description: "## 1️⃣ Overview\n\n**Purpose:**  \nRetrieves the list of all workspaces accessible to the authenticated user or service account.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nGET /noCo/api/v2/workspaces\n\n```\n\n---\n\n## 3️⃣ Authentication\n\nRequires Bearer-style authentication using:\n\n```\nAuthorization: Bearer <token>\n\n```\n\n---\n\n## 4️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n\n---\n\n## 5️⃣ Example Request\n\n``` bash\ncurl -X GET https://be.datagol.ai/noCo/api/v2/workspaces \\\n-H \"Authorization: Bearer <token>\"\n\n```\n\n---\n\n## 6️⃣ Behavior Summary\n\nThis endpoint returns all workspaces that are accessible to the authenticated user or service account.\n\nIt supports workspace-level access control and filters results based on user permissions."

  /idp/api/v1/user/sign-up:
    post:
      summary: User Sign Up
      tags:
        - Sign up
      description: "## 1️⃣ Overview\n\n**Purpose:**\nRegisters a new user account. Supports two sign-up flows:\n\n- **Self Registration** — User registers independently. No hash required. An OTP is sent to the email for verification.\n\n- **Workspace Invitation** — User was invited to a workspace via email. The invitation `hash` (received in the invitation email) must be provided along with name and password.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nPOST /idp/api/v1/user/sign-up\n```\n\n---\n\n## 3️⃣ Authentication\n\nNo authentication required. This is a public endpoint.\n\n---\n\n## 4️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 5️⃣ Request Body Schema\n\n``` json\n{\n  \"email\": \"string\",\n  \"password\": \"string\",\n  \"firstname\": \"string\",\n  \"lastname\": \"string\",\n  \"hash\": \"string\"\n}\n```\n\n---\n\n## 6️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| email | string | ✅ Yes | User's email address |\n| password | string | ✅ Yes | Must meet the password policy (see notes) |\n| firstname | string | ✅ Yes | User's first name |\n| lastname | string | ✅ Yes | User's last name |\n| hash | string | ⚠️ Conditional | Invitation UUID. Invitation flow only. |\n\n**Notes**\n\n- **password** — Min 8 chars, with at least one uppercase letter, lowercase letter, number and special character.\n- **hash** — The UUID from the invitation email. Required for the workspace invitation flow; must be omitted for self-registration.\n\n---\n\n## 7️⃣ Sign-Up Flows\n\n### 🔵 Self Registration\n\n```json\n{\n  \"email\": \"user@example.com\",\n  \"password\": \"password123\",\n  \"firstname\": \"John\",\n  \"lastname\": \"Doe\"\n}\n```\n\n- No `hash` required\n- OTP is sent to the provided email\n- User must verify email via `/idp/api/v1/user/signUp/verifyEmailOtp`\n\n### 🟢 Workspace Invitation\n\n```json\n{\n  \"email\": \"user@example.com\",\n  \"password\": \"password123\",\n  \"firstname\": \"John\",\n  \"lastname\": \"Doe\",\n  \"hash\": \"e0754cfc-f7d1-4cc3-8690-e34a2f17291d\"\n}\n```\n\n- `hash` is mandatory and must match the one received in the invitation email\n- User is directly linked to the inviting workspace upon successful registration\n\n---\n\n## 8️⃣ Behavior Summary\n\n```\n• Self Registration — OTP is dispatched to the email. Account is pending until OTP is verified.\n• Workspace Invitation — Hash is validated against the invitation. Account is activated and linked to the workspace.\n• Password Policy — Enforced for both flows.\n```\n\n---\n\n## 📌 Additional Notes\n\n- For self-registration, the OTP verification step is mandatory to activate the account.\n- For workspace invitation, the `hash` is single-use and time-limited.\n- `firstname` and `lastname` are required for both flows."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - firstname
                - lastname
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address
                password:
                  type: string
                  format: password
                  description: Must include uppercase, lowercase, number, and special character.
                  minLength: 8
                firstname:
                  type: string
                  description: User's first name
                lastname:
                  type: string
                  description: User's last name
                hash:
                  type: string
                  format: uuid
                  description: Invitation hash received in the workspace invitation email. Required only for workspace invitation flow.
            examples:
              SelfRegistration:
                summary: Self Registration (no hash)
                value:
                  email: demo@abc.com
                  password: PasswordDemo1
                  firstname: John
                  lastname: Peter
              WorkspaceInvitation:
                summary: Workspace Invitation (with hash)
                value:
                  email: demo@abc.com
                  password: PasswordDemo1
                  firstname: John
                  lastname: Peter
                  hash: XXXX-XXX-XXXXX
      responses:
        '200':
          description: "Self Registration: User registered successfully and OTP sent to email. | Workspace Invitation: User registered and linked to the workspace."
        '400':
          description: Bad Request — Invalid input, missing required fields, or invalid/expired hash
        '409':
          description: Conflict — Email already exists
        '500':
          description: Internal Server Error

  /idp/api/v1/user/signUp/verifyEmailOtp:
    post:
      summary: Verify Email OTP for Sign Up
      tags:
        - Sign up
      description: "## 1️⃣ Overview\n\n**Purpose:**\nVerifies the OTP sent to the user's email as the second step of the **self-registration flow**. On successful verification, the user's account is activated.\n\n> ⚠️ This endpoint is only applicable for the **Self Registration** flow. Users who signed up via a **Workspace Invitation** (with a hash) do not need to complete this step.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nPOST /idp/api/v1/user/signUp/verifyEmailOtp\n```\n\n---\n\n## 3️⃣ Authentication\n\nNo authentication required. This is a public endpoint.\n\n---\n\n## 4️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 5️⃣ Request Body Schema\n\n``` json\n{\n  \"email\": \"string\",\n  \"otp\": \"string\"\n}\n```\n\n---\n\n## 6️⃣ Field Descriptions\n\n| Field | Type | Required | Description |\n| --- | --- | --- | --- |\n| email | string | ✅ Yes | Must match the email used in the sign-up request |\n| otp | string | ✅ Yes | One-time password sent to the user's email after sign-up |\n\n---\n\n## 7️⃣ Behavior Summary\n\n```\nSecond step of the Self Registration flow.\n• OTP Validation — The OTP must match the one dispatched during sign-up.\n• Account Activation — On successful verification, the user account is fully activated.\n• OTP Expiry — OTP is time-limited. If expired, the user must re-initiate the sign-up.\n• Flow Specific — Only applicable for self-registered users. Invitation-based users are activated immediately upon sign-up.\n```\n\n---\n\n## 📌 Additional Notes\n\n- This is **Step 2** of the self-registration flow. Step 1 is `POST /idp/api/v1/user/sign-up`.\n- The email must exactly match the one used during sign-up.\n- Workspace invitation users skip this step entirely as their account is activated via hash validation."
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - otp
              properties:
                email:
                  type: string
                  format: email
                  description: User's email address used during sign-up
                otp:
                  type: string
                  description: One-time password sent to the user's email after sign-up
                  example: '157746'
            example:
              email: demo@abc.com
              otp: '157746'
      responses:
        '200':
          description: OTP verified successfully — account activated
        '400':
          description: Bad Request — Invalid or expired OTP
        '404':
          description: Not Found — Email not registered
        '500':
          description: Internal Server Error

  /noCo/api/v2/workspaces/{workspaceId}/bulkUsers:
    post:
      summary: Add User to Workspace
      security:
        - bearerAuth: [ ]
      responses:
        '200':
          description: Add User to Workspace
      tags:
        - Workspaces
      description: "## 1️⃣ Overview\n\n**Purpose:**\nAllows adding multiple users to a specific workspace in a single request.\n\nEach user is assigned a role within the workspace.\n\nUpon being added, the invited user receives an email containing a registration link with a unique `hash` and `type` as query parameters:\n\n```\nhttp://<app-domain>/register?hash=e0754cfc-f7d1-4cc3-8690-e34a2f17291d&type=WORK_SPACE\n```\n\n- `hash` — A unique UUID tied to the workspace invitation. Must be passed in the sign-up API to complete registration.\n- `type` — Indicates the invitation context. `WORK_SPACE` means the user is being invited to a workspace.\n\n---\n\n## 2️⃣ Endpoint\n\n``` bash\nPOST /noCo/api/v2/workspaces/{workspaceId}/bulkUsers\n```\n\n---\n\n## 3️⃣ Path Parameters\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workspaceId | UUID | ✅ Yes | Identifier of the workspace |\n\n---\n\n## 4️⃣ Authentication\n\nRequires authentication using:\n\n``` bash\nAuthorization: Bearer <token>\n```\n\n---\n\n## 5️⃣ Request Headers\n\n| Header | Required |\n| --- | --- |\n| Authorization | ✅ Yes |\n| Content-Type: application/json | ✅ Yes |\n\n---\n\n## 6️⃣ Request Body Schema\n\n``` json\n{\n  \"workSpaceUsers\": [\n    {\n      \"email\": \"string\",\n      \"role\": \"string\"\n    }\n  ],\n  \"message\": \"string\"\n}\n```\n\n---\n\n## 7️⃣ Field Descriptions\n\n### Workspace Users\n\n| Parameter | Type | Required | Description |\n| --- | --- | --- | --- |\n| workSpaceUsers | array | ✅ Yes | List of users to be added to the workspace |\n| workSpaceUsers.email | string | ✅ Yes | Email ID of the user |\n| workSpaceUsers.role | string | ✅ Yes | Role assigned in the workspace (CREATOR, EDITOR, VIEWER) |\n| message | string | ❌ No | Optional message sent along with the invite |\n\n---\n\n## 8️⃣ Invitation Flow\n\nOnce this API is called successfully, the invited user receives an email with a registration link:\n\n```\nhttp://<app-domain>/register?hash=e0754cfc-f7d1-4cc3-8690-e34a2f17291d&type=WORK_SPACE\n```\n\nThe user must use this link to complete their registration by calling:\n\n```\nPOST /idp/api/v1/user/sign-up\n```\n\nWith the `hash` extracted from the link:\n\n``` json\n{\n  \"email\": \"user@example.com\",\n  \"password\": \"password123\",\n  \"firstname\": \"John\",\n  \"lastname\": \"Doe\",\n  \"hash\": \"e0754cfc-f7d1-4cc3-8690-e34a2f17291d\"\n}\n```\n\n> ⚠️ The `hash` is single-use and time-limited. If expired, the workspace admin must re-invite the user.\n\n---\n\n## 9️⃣ Example Request\n\n``` bash\ncurl -X POST https://be.datagol.ai/noCo/api/v2/workspaces/{workspaceId}/bulkUsers \\\n-H \"Authorization: Bearer <token>\" \\\n-H \"Content-Type: application/json\" \\\n-d '{\n  \"workSpaceUsers\": [\n    {\n      \"email\": \"user1@datagol.com\",\n      \"role\": \"EDITOR\"\n    },\n    {\n      \"email\": \"user2@datagol.com\",\n      \"role\": \"VIEWER\"\n    }\n  ],\n  \"message\": \"Workspace access invitation\"\n}'\n```\n\n---\n\n## 🔟 Behavior Summary\n\n```\nEnables bulk addition of users to a workspace and assigns roles to each user.\n• Role Assignment — Each user is assigned CREATOR, EDITOR, or VIEWER role.\n• Invitation Email — Each invited user receives an email with a registration link containing a unique hash and type=WORK_SPACE.\n• Hash-Based Registration — The invited user must use the hash from the email link to complete sign-up via POST /idp/api/v1/user/sign-up.\n• OTP Not Required — Workspace-invited users are activated via hash validation and do not go through the OTP verification step.\n```"
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                workSpaceUsers:
                  type: array
                  items:
                    type: object
                    properties:
                      email:
                        type: string
                        format: email
                      role:
                        type: string
                        enum:
                          - CREATOR
