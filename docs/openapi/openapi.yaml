      description: |
        ## 1️⃣ Overview

        **Purpose:**
        Adds a dependency between two nodes: the `toNodeId` pipeline runs only after the `fromNodeId` pipeline finishes. Nodes run in topological order along these edges.

        ---

        ## 2️⃣ Endpoint

        ``` bash
        POST /orchestration/api/v1/dags/{dagId}/edges
        ```

        ---

        ## 3️⃣ Field Descriptions

        | Field | Type | Required | Description |
        | --- | --- | --- | --- |
        | fromNodeId | int64 | ✅ Yes | Upstream node ID (a node ID, not a pipeline ID) |
        | toNodeId | int64 | ✅ Yes | Downstream node ID |
        | metadata | object | ❌ No | Free-form JSON |

        ---

        ## 4️⃣ Example Request

        ``` bash
        curl -X POST 'https://be.datagol.ai/orchestration/api/v1/dags/42/edges' \
        -H "Authorization: Bearer <token>" \
        -H "Content-Type: application/json" \
        -d '{ "fromNodeId": 501, "toNodeId": 502 }'
        ```

        ---

        ## 5️⃣ Validation

        | Rejected with 400 when |
        | --- |
        | `fromNodeId` or `toNodeId` is missing |
        | `fromNodeId` equals `toNodeId` |
        | Either node is not in this DAG |
        | The same edge already exists |
        | The edge would create a cycle |
